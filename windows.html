  const ch = t.closest('[data-chip]'); if (ch && w) { w.st.g = ch.dataset.chip || null; w.st.shown = 150; w.draw(); return; }
  const m = t.closest('[data-more]'); if (m && w) { w.st.shown += 300; w.draw(); return; }
  const d = t.closest('[data-d]'); if (d) { const i = +d.dataset.d; openWin('d:' + i, DATA.depts[i].name, `${fmtNum(summary(S.R).dept[i].total)} 個檔有變化`, null, (box, ww) => fillList(box, ww, { d: i }), d); return; }
  const g = t.closest('[data-g]'); if (g) { const gg = g.dataset.g; openWin('g:' + gg, '全部的' + GL[gg], '', gg, (box, ww) => fillList(box, ww, { g: gg }), g); return; }
  const b = t.closest('[data-batch]'); if (b) { const bb = rangeBatches(S.R).get(b.dataset.batch); openWin('b:' + bb.key, baseOf(bb.p) || '最上層', BATCH_VERB[bb.g], bb.g, box => fillBatch(box, bb), b); return; }
  const e = t.closest('[data-ev]'); if (e) { const ee = S.R.ev[+e.dataset.ev]; openWin('e:' + ee.i, baseOf(ee.p), typeLabel(ee), gOf(ee), box => fillDetail(box, ee), e); return; }
  const f = t.closest('[data-file]'); if (f && w) { const pe = S.R.ev[+w.key.slice(2)], k = +f.dataset.file; openWin(w.key + ':f' + k, baseOf(pe.f[k].r), '', gOf(pe), box => fillDetail(box, pe, pe.f[k]), f); }
});
wireCopy(document);
// drag a window by its title bar
desk.addEventListener('pointerdown', ev => {
  const bar = ev.target.closest('.wt'); if (!bar || ev.target.closest('[data-w]')) return;
  const w = S.wins.find(x => x.el.contains(bar)); if (!w) return;
  front(w); w.el.classList.add('dragging');
  const sx = ev.clientX, sy = ev.clientY, ox = w.r.x, oy = w.r.y, D = desk.getBoundingClientRect();
  bar.setPointerCapture && (() => { try { bar.setPointerCapture(ev.pointerId); } catch {} })();
  const mv = e => { place(w, { ...w.r, x: Math.min(D.width - 80, Math.max(-w.r.w + 120, ox + e.clientX - sx)), y: Math.min(D.height - 40, Math.max(0, oy + e.clientY - sy)) }); };
  const up = () => { w.el.classList.remove('dragging'); bar.removeEventListener('pointermove', mv); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up); };
  bar.addEventListener('pointermove', mv); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  const top = S.wins.filter(x => !x.min).sort((a, b) => +b.el.style.zIndex - +a.el.style.zIndex)[0];
  if (top) closeWin(top);
});
zmonBoot(() => setRange(startRange()));
