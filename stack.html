*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font:13.5px/1.6 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}

.c-add{--c:var(--add)} .c-del{--c:var(--del)} .c-ren{--c:var(--ren)} .c-size{--c:var(--size)} .c-time{--c:var(--time)}

.top{height:48px;display:flex;align-items:center;gap:16px;padding:0 28px}

.top select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line2);border-radius:4px;padding:4px 8px}
.stack{position:relative;height:calc(100% - 48px)}
.card{position:absolute;top:6px;bottom:22px;background:var(--paper);border-radius:3px;
  box-shadow:0 1px 1px rgba(60,48,30,.06),0 3px 6px rgba(60,48,30,.07),0 18px 40px -12px rgba(60,48,30,.28);
  display:flex;flex-direction:column;overflow:hidden;transform-origin:0 50%;
  transition:left 460ms var(--spring),width 460ms var(--spring),transform 460ms var(--spring),filter 300ms ease}
.card.under{filter:brightness(.965) saturate(.9);transform:scale(.985)}
.card.under:hover{filter:brightness(.99)}
.card .tab{position:absolute;left:0;top:0;bottom:0;width:58px;display:none;border-right:1px solid var(--line);background:linear-gradient(90deg,var(--paper2),var(--paper));z-index:2}
.card.under .tab{display:flex;flex-direction:column;align-items:center;padding-top:22px;gap:10px;cursor:pointer}

.tab small{writing-mode:vertical-rl;font-size:11px;color:var(--faint)}
.card .in{flex:1;overflow:auto;padding:34px 48px 40px 52px}
.card.under .in{overflow:hidden}

.close:hover{background:var(--paper2);color:var(--ink)}
.kick{font-size:11.5px;letter-spacing:.18em;color:var(--muted);font-weight:600}

const BATCH_VERB = { add: '新增', del: '刪除', ren: '改名或搬進來', size: '大小變了', time: '只改了修改時間' };
// up to n things worth looking at first: whole folders gone, files deleted, folders renamed, new folders
function notable(R, n = 3) {
  const out = [], B = rangeBatches(R);
  for (const e of R.ev) {
    if (e.k === 'fdel') out.push({ e, s: 1e8 + e.n });
    else if (e.k === 'fren') out.push({ e, s: 3e7 + e.n });
    else if (e.k === 'fadd') out.push({ e, s: 1e7 + e.n });
    else if (e.k === 'del' && !B.has(batchKey(e))) out.push({ e, s: 5e7 + Math.min(e.s / 1e3, 1e6) });
    else if (e.k === 'mov') out.push({ e, s: 1e6 });
  }
  for (const b of B.values()) if (b.g === 'del') out.push({ b, s: 6e7 + b.n });
  return out.sort((x, y) => y.s - x.s).slice(0, n);
}
// departments with changes (deletions first, then by volume) and the quiet ones
function deptOrder(R) {
  const M = summary(R);
  const idx = DATA.depts.map((d, i) => i);
  return {
    busy: idx.filter(i => M.dept[i].total > 0).sort((x, y) => (M.dept[y].del > 0) - (M.dept[x].del > 0) || M.dept[y].total - M.dept[x].total),
    quiet: idx.filter(i => M.dept[i].total === 0),
  };
}
const eventsOf = (R, f = {}) => { summary(R); return R.ev.filter(e => (f.d == null || e.d === f.d) && (f.g == null || gOf(e) === f.g)); };
const filesOf = list => list.reduce((a, e) => a + cnt(e), 0);

// what a row says about itself: title (with old → new), where, size note
function rowText(e) {
  const g = gOf(e);
  const name = e.k === 'fren' || e.k === 'ren' || (e.k === 'mov' && e.nm)
    ? (baseOf(e.p0) === baseOf(e.p) ? { now: baseOf(e.p) } : { old: baseOf(e.p0), now: baseOf(e.p) })
    : { now: baseOf(e.p) };
  let place = where(dirOf(e.p));
  if (e.k === 'mov' || (e.k === 'fren' && e.mv)) place = `從 ${where(dirOf(e.p0))} 到 ${where(dirOf(e.p))}`;
  const meta = e.n ? `${fmtNum(e.n)} 個檔 · ${fmtBytes(e.b)}` : e.k === 'size' ? fmtDelta(e.s1 - e.s0) : e.k === 'time' ? fmtTime(e.t1) : fmtBytes(e.s);
  return { g, label: typeLabel(e), name, place, meta, folder: !!e.n };
}
function batchText(b) {
  return { g: b.g, label: `${BATCH_VERB[b.g]} ${fmtNum(b.n)} 個檔`, name: { now: baseOf(b.p) || '（部門最上層）' }, place: where(dirOf(b.p)),
    meta: b.g === 'size' ? fmtDelta(b.b) : b.g === 'time' ? '' : fmtBytes(b.b), folder: true };
}

// before | after for one change (or one file inside a folder change)
function snapPath(rel, point) { return (DATA.snapRoot || `${DATA.drive}\\@Recently-Snapshot\\{snap}`).replace('{snap}', point.snap) + '\\' + rel; }
function detailModel(e, child, R) {
  const A = R.before, B = R.after;
  let f = e, p0 = e.p0 || e.p, p1 = e.p;
  if (child) { f = child; p0 = (e.p0 || e.p) + '\\' + child.r; p1 = e.p + '\\' + child.r; }
  const isFolder = !child && !!e.n;
  const kind = child ? (e.k === 'fadd' ? '新增' : e.k === 'fdel' ? '刪除' : e.mv ? '跟著資料夾搬移' : '跟著資料夾改名') : typeLabel(e);
  const had = !(e.k === 'add' || e.k === 'fadd'), has = !(e.k === 'del' || e.k === 'fdel');
  const sA = child ? f.s : e.k === 'size' ? e.s0 : isFolder ? e.b : e.s;
  const sB = child ? f.s : e.k === 'size' ? e.s1 : isFolder ? e.b : e.s;
  const tA = child ? f.t : (e.t0 ?? e.t), tB = child ? f.t : (e.t1 ?? e.t);
  return { e, g: gOf(e), kind, isFolder, had, has, p0, p1, nameA: baseOf(p0), nameB: baseOf(p1), dirA: dirOf(p0), dirB: dirOf(p1),
    sA, sB, tA, tB, n: e.n, files: isFolder ? (e.f || []) : null, dept: deptName(e.d), A, B,
    nowPath: `${DATA.drive}\\${p1}`, oldPath: snapPath(p0, A) };
}
function nameMarks(a, b) {
  if (a === b) return [esc(a), esc(b)];
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  let j = 0; while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
  const m = s => esc(s.slice(0, i)) + (s.length - j > i ? `<mark>${esc(s.slice(i, s.length - j))}</mark>` : '') + esc(s.slice(s.length - j));
  return [m(a), m(b)];
}
// path as segments; segments after the first difference are marked
function pathHtml(p, other, sep = '<i class="sep">/</i>') {
  const a = segs(p), b = other == null ? a : segs(other);
  let k = 0; while (k < a.length && k < b.length && a[k] === b[k]) k++;
  return a.map((s, i) => i >= k ? `<mark>${esc(s)}</mark>` : `<span>${esc(s)}</span>`).join(sep);
}
function copyText(v) {
  return (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).catch(() => {
    const ta = document.createElement('textarea'); ta.value = v; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  });
}
// a copy button that says 已複製 for a moment
function wireCopy(root) {
  root.addEventListener('click', ev => {
    const t = ev.target.closest('[data-copy]'); if (!t) return;
    ev.stopPropagation();
    copyText(t.dataset.copy).then(() => { const old = t.innerHTML; t.classList.add('done'); t.innerHTML = ICON.ok + '已複製'; setTimeout(() => { t.classList.remove('done'); t.innerHTML = old; }, 1400); });
  });
}
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
// run a WAAPI animation and always finish within ms+250 even when the page is not painting
function animate(el, frames, opts) {
  if (reduceMotion() || !el.animate) return Promise.resolve();
  const a = el.animate(frames, { fill: 'none', ...opts });
  return new Promise(res => { let done = false; const fin = () => { if (!done) { done = true; res(); } }; a.onfinish = fin; a.oncancel = fin; setTimeout(fin, (opts.duration || 300) + (opts.delay || 0) + 250); });
}

const S = { R: null, cards: [] };
const $ = id => document.getElementById(id);
const stackEl = $('stack');
const TAB = 58;

// geometry: every card has the same width; each deeper card is 58px further right, so only its tab shows under the next one
function layout(entering) {
  const W0 = stackEl.clientWidth, n = S.cards.length;
  const w = Math.min(880, W0 - 56 - (n - 1) * TAB);
  const total = (n - 1) * TAB + w, left0 = Math.max(28, Math.round((W0 - total) / 2));
  S.cards.forEach((c, k) => {
    const left = left0 + k * TAB, top = k === n - 1;
    c.el.classList.toggle('under', !top);
    c.el.style.zIndex = 10 + k;
    c.el.style.width = w + 'px';
    if (c === entering) {
      c.el.style.transition = 'none'; c.el.style.left = left + 'px';
      c.el.offsetWidth; c.el.style.transition = '';
      animate(c.el, [{ transform: 'translateX(120px) rotate(1.6deg)', opacity: 0 }, { opacity: 1, offset: .3 }, { transform: 'none', opacity: 1 }], { duration: 520, easing: 'cubic-bezier(.2,1.25,.32,1)' });
    } else c.el.style.left = left + 'px';
  });
}
function push(level, key, tab, sub, fill) {
  if (S.cards[level] && S.cards[level].key === key) { pop(level + 1); return; }
  pop(level);
  const el = document.createElement('section');
  el.className = 'card';
  el.innerHTML = `<button class="tab" data-pop="${level + 1}"><span>${esc(tab)}</span>${sub ? `<small>${esc(sub)}</small>` : ''}</button>${level ? `<button class="close" data-pop="${level}" aria-label="收起這一張">${ICON.x}</button>` : ''}<div class="in"></div>`;
  stackEl.appendChild(el);
  const c = { key, el, tab };
  S.cards.push(c);
  fill(el.querySelector('.in'), c);
  layout(c);
}
function pop(fromLevel) {
  const gone = S.cards.splice(fromLevel);
  gone.reverse().forEach((c, k) => {
    animate(c.el, [{ transform: 'none', opacity: 1 }, { transform: 'translateX(90px) rotate(1.2deg)', opacity: 0 }], { duration: 260, delay: k * 40, easing: 'cubic-bezier(.4,0,.6,.2)' }).then(() => c.el.remove());
    c.el.style.pointerEvents = 'none';
  });
  layout();
}

function fillOverview(box) {
  const R = S.R, M = summary(R), H = headline(R), O = deptOrder(R);
  const a = R.before, b = R.after;
  let html = `<div class="kick num">${esc(R.span)}</div>
    <div style="margin-top:12px"><span class="sev ${H.lv}"><i></i>${H.lvText}</span></div>
    <h1>${esc(H.head)}</h1>
    <div class="lead num">檔案 <b>${fmtNum(a.files)}</b> → <b>${fmtNum(b.files)}</b>（${fmtSigned(b.files - a.files)}）　容量 <b>${fmtBytes(a.bytes)}</b> → <b>${fmtBytes(b.bytes)}</b>（${fmtDelta(b.bytes - a.bytes)}）${H.more.length ? '<br>' + esc(H.more.join('；')) : ''}</div>`;
  const nts = notable(R);
  if (nts.length) html += `<div class="rule"></div><div class="h3">先看這幾件</div><div class="firsts">${nts.map(({ e, b }) => {
    const T = b ? batchText(b) : rowText(e), nm = T.name.old ? `${T.name.old} → ${T.name.now}` : T.name.now;
    return `<button class="first c-${T.g}" ${b ? `data-batch="${esc(b.key)}"` : `data-ev="${e.i}"`}><b><em>${esc(T.label)}</em>${esc(nm)}</b><p>${esc(deptName(b ? b.d : e.d))} · ${esc(T.meta)} · ${esc(T.place)}</p></button>`;
  }).join('')}</div>`;
  const gs = GROUPS.filter(x => x.g !== 'time' && M.by[x.g]);
  if (gs.length) html += `<div class="rule"></div><div class="h3">變化</div><div class="types">${gs.map(x => `<button class="c-${x.g}" data-g="${x.g}"><b class="num">${fmtNum(M.by[x.g])}</b><span>${x.label}</span></button>`).join('')}</div>`;
  html += `<div class="rule"></div><div class="h3">部門</div><div class="dl">${O.busy.map(i => {
    const c = M.dept[i];
    const bars = GROUPS.filter(x => x.g !== 'time' && c[x.g]).map(x => `<span class="c-${x.g}" style="width:${(c[x.g] / c.total * 100).toFixed(1)}%"></span>`).join('');
    return `<button class="d" data-d="${i}"><b>${esc(DATA.depts[i].name)}<small>${esc(DATA.depts[i].code)}</small></b><span class="bar">${bars}</span><span class="n num">${fmtNum(c.total)}</span></button>`;
  }).join('')}</div>${O.quiet.length ? `<div class="quiet">沒有變化：${O.quiet.map(i => esc(DATA.depts[i].name)).join('、')}</div>` : ''}`;
  if (DATA.days.length > 1) {
    const max = Math.max(1, ...DATA.days.map(d => d.c.total));
    html += `<div class="rule"></div><div class="h3">每天</div><div class="daysx">${DATA.days.map(d => {
      const h = d.c.total ? Math.max(2, d.c.total / max * 48) : 1, hd = d.c.total ? d.c.del / d.c.total * h : 0;
      return `<button class="dx${R.days && R.days.includes(d.id) ? ' on' : ''}" data-range="${esc(d.range)}"><i><b style="height:${(h - hd).toFixed(1)}px"></b>${hd ? `<b class="d" style="height:${hd.toFixed(1)}px"></b>` : ''}</i><span class="num">${esc(d.md)} ${esc(d.wk)}</span></button>`;
    }).join('')}</div>`;
  }
  html += `<div class="foot">比較的是 NAS 在 ${esc(R.span)} 拍的兩份快照${R.ignored ? `　·　略過 ${fmtNum(R.ignored)} 個暫存與縮圖檔` : ''}</div>`;
  box.innerHTML = html;
}
function itemHtml(x) {
  const T = x.b ? batchText(x.b) : rowText(x.e);
  const nm = T.name.old ? `<s>${esc(T.name.old)}</s>　→　${esc(T.name.now)}` : esc(T.name.now);
  return `<button class="it c-${T.g}" ${x.b ? `data-batch="${esc(x.b.key)}"` : `data-ev="${x.e.i}"`}><span class="l1"><b>${nm}${T.folder ? `<span class="tagf">${x.b ? esc(T.label) : '資料夾 · ' + fmtNum(x.e.n) + ' 個檔'}</span>` : ''}</b><span class="num">${esc(T.meta)}</span></span><span class="l2">${x.b ? '' : esc(T.label) + ' · '}${esc(T.place)}</span></button>`;
}
function fillList(box, card, f) {
  const R = S.R, all = eventsOf(R, f);
  const st = { g: null, shown: 120 };
  const draw = () => {
    const items = st.g ? all.filter(e => gOf(e) === st.g) : all;
    const title = f.d != null ? DATA.depts[f.d].name : `全部的${GL[f.g]}`;
    let html = `<div class="kick num">${esc(R.short)}　·　${fmtNum(filesOf(all))} 個檔有變化</div><h2>${esc(title)}</h2>`;
    if (f.d != null) {
      const gs = GROUPS.filter(x => all.some(e => gOf(e) === x.g));
      if (gs.length > 1) html += `<div class="chips"><button class="chip" data-chip="" aria-pressed="${!st.g}">全部</button>${gs.map(x => `<button class="chip" data-chip="${x.g}" aria-pressed="${st.g === x.g}">${x.label} ${fmtNum(filesOf(all.filter(e => gOf(e) === x.g)))}</button>`).join('')}</div>`;
    }
    let shown = 0;
    for (const x of GROUPS) {
      const gi = items.filter(e => gOf(e) === x.g); if (!gi.length || shown >= st.shown) continue;
      html += `<div class="grp c-${x.g}">${x.label}　${fmtNum(filesOf(gi))}</div>`;
      for (const r of displayItems(R, gi)) { if (shown >= st.shown) break; html += itemHtml(r); shown++; }
    }
    const total = GROUPS.reduce((a, x) => a + displayItems(R, items.filter(e => gOf(e) === x.g)).length, 0);
    if (total > shown) html += `<button class="more" data-more>再顯示一些（還有 ${fmtNum(total - shown)} 列）</button>`;
    box.innerHTML = html;
  };
  card.st = st; card.draw = draw; draw();
}
function fillBatch(box, b) {
  const R = S.R;
  box.innerHTML = `<div class="kick c-${b.g}" style="color:var(--c)">這個資料夾${esc(BATCH_VERB[b.g])} ${fmtNum(b.n)} 個檔</div><h2>${esc(baseOf(b.p) || '（部門最上層）')}/</h2>
    <div class="lead">${esc(deptName(b.d))} · ${esc(where(dirOf(b.p)))}</div>
    <div class="acts"><button class="btn" data-copy="${esc(DATA.drive + '\\' + b.p)}">${ICON.copy}複製資料夾的位置</button></div>
    <div style="margin-top:12px">${b.items.slice().sort((p, q) => (baseOf(p.p) < baseOf(q.p) ? -1 : 1)).map(e => itemHtml({ e })).join('')}</div>`;
}
function sheet(D, side) {
  const had = side === 'b' ? D.had : D.has;
  const at = side === 'b' ? D.A.at : D.B.at;
  const k = `${side === 'b' ? '之前' : '之後'}　·　<span class="num">${fmtMD(at)} ${fmtHM(at)}</span>`;
  if (!had) return `<div class="sheet ${side === 'b' ? 'before' : 'after'}"><div class="k">${k}</div><div class="none">${side === 'b' ? '還沒有這個' + (D.isFolder ? '資料夾' : '檔') : '不在了'}</div></div>`;
  const [ma, mb] = nameMarks(D.nameA, D.nameB);
  const both = D.had && D.has;
  const dir = side === 'b' ? D.dirA : D.dirB, other = side === 'b' ? D.dirB : D.dirA;
  const s = side === 'b' ? D.sA : D.sB, t = side === 'b' ? D.tA : D.tB;
  return `<div class="sheet ${side === 'b' ? 'before' : 'after'}"><div class="k">${k}</div><div class="nm">${side === 'b' ? ma : mb}${D.isFolder ? '/' : ''}</div>
    <dl><dt>位置</dt><dd class="p">${pathHtml(dir || '（最上層）', both ? other : null)}</dd>
    <dt>${D.isFolder ? '內容' : '大小'}</dt><dd class="num">${D.isFolder ? fmtNum(D.n) + ' 個檔 · ' : ''}${fmtBytes(s)}${side === 'a' && both && D.sA !== D.sB ? `（${fmtDelta(D.sB - D.sA)}）` : ''}</dd>
    ${D.isFolder ? '' : `<dt>修改時間</dt><dd class="num">${fmtTime(t)}</dd>`}</dl></div>`;
}
function fillDetail(box, e, child) {
  const D = detailModel(e, child, S.R);
  let html = `<div class="kick c-${D.g}" style="color:var(--c)">${esc(D.kind)}</div><h2>${esc(D.nameB)}${D.isFolder ? '/' : ''}</h2><div class="lead">${esc(D.dept)}</div>
    <div class="ba c-${D.g}">${sheet(D, 'b')}<div class="down">${ICON.down}</div>${sheet(D, 'a')}</div>
    <div class="acts">${D.has ? `<button class="btn" data-copy="${esc(D.nowPath)}">${ICON.copy}複製現在的位置</button>` : ''}${D.had ? `<button class="btn" data-copy="${esc(D.oldPath)}">${ICON.copy}複製 ${fmtMD(D.A.at)} 快照裡的位置</button>` : ''}</div>`;
  if (!D.has) html += `<div class="hint">${fmtMD(D.A.at)} 凌晨的快照裡還有，複製位置貼到檔案總管就能找回來。</div>`;
  if (e.k === 'mov' && !e.sure && !child) html += '<div class="hint">名字和位置都不一樣，是靠大小與修改時間配起來的，可能不是同一個檔。</div>';
  if (D.isFolder) html += `<div class="files">${D.files.slice(0, 300).map((f, k) => `<button data-file="${k}"><span>${esc(f.r.split('\\').join(' / '))}</span><span class="num">${fmtBytes(f.s)}</span></button>`).join('')}</div>`;
  box.innerHTML = html;
}

function setRange(id) {
  S.R = rangeById(id); tellRange(S.R);
  $('rangeSel').value = id;
  if (S.cards.length) {
    const old = S.cards.splice(0);
    old.forEach((c, k) => { c.el.style.pointerEvents = 'none'; animate(c.el, [{ transform: 'none', opacity: 1 }, { transform: 'translateY(30px) rotate(-1deg)', opacity: 0 }], { duration: 240, delay: k * 30, easing: 'ease-in' }).then(() => c.el.remove()); });
  }
  push(0, 'ov:' + id, '總覽', S.R.short, box => fillOverview(box));
}
function levelOf(el) { const c = el.closest('.card'); return S.cards.findIndex(x => x.el === c); }
stackEl.addEventListener('click', ev => {
  const t = ev.target;
  if (t.closest('[data-copy]')) return;
  const p = t.closest('[data-pop]'); if (p) { pop(+p.dataset.pop); return; }
  const lv = levelOf(t); if (lv < 0) return;
  const card = S.cards[lv];
  const r = t.closest('[data-range]'); if (r) { setRange(r.dataset.range); return; }
  const d = t.closest('[data-d]'); if (d) { const i = +d.dataset.d; push(lv + 1, 'd:' + i, DATA.depts[i].name, '', (box, c) => fillList(box, c, { d: i })); return; }
  const g = t.closest('[data-g]'); if (g) { const gg = g.dataset.g; push(lv + 1, 'g:' + gg, GL[gg], '', (box, c) => fillList(box, c, { g: gg })); return; }
  const ch = t.closest('[data-chip]'); if (ch) { card.st.g = ch.dataset.chip || null; card.st.shown = 120; card.draw(); pop(lv + 1); return; }
  const m = t.closest('[data-more]'); if (m) { card.st.shown += 300; card.draw(); return; }
  const b = t.closest('[data-batch]'); if (b) { const bb = rangeBatches(S.R).get(b.dataset.batch); push(lv + 1, 'b:' + bb.key, baseOf(bb.p) || '最上層', '', box => fillBatch(box, bb)); return; }
  const e = t.closest('[data-ev]'); if (e) { const ee = S.R.ev[+e.dataset.ev]; push(lv + 1, 'e:' + ee.i, baseOf(ee.p), '', box => fillDetail(box, ee)); return; }
  const f = t.closest('[data-file]'); if (f) { const pe = S.R.ev[+card.key.slice(2)], k = +f.dataset.file; push(lv + 1, card.key + ':f' + k, baseOf(pe.f[k].r), '', box => fillDetail(box, pe, pe.f[k])); }
});
wireCopy(stackEl);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.cards.length > 1) pop(S.cards.length - 1); });
let rz; addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => layout()); });
zmonBoot(() => {
  $('share').textContent = DATA.shareName;
  $('rangeSel').innerHTML = [...DATA.days.map(d => d.range).reverse(), ...DATA.presets.filter(p => !p.startsWith('day:'))].map(id => `<option value="${esc(id)}">${esc(rangeById(id).short)}</option>`).join('');
  $('rangeSel').addEventListener('change', e => setRange(e.target.value));

});
