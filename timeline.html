<style>
:root{--bg:#f6f5f1;--band:#fbfaf7;--ink:#23231f;--ink2:#4a4a43;--muted:#77776c;--faint:#a5a59a;--line:#e3e2da;--line2:#cdccc1;
  --add:#5b8148;--del:#b0533c;--ren:#47729a;--size:#a87a22;--time:#86867a;--ok:#4a6b42;--warn:#a3711f;--bad:#9c3a2e;--sel:#23231f;
  --sans:"Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans TC","Segoe UI",sans-serif;--num:"Bahnschrift","Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.55 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--ren);outline-offset:2px;border-radius:4px}
svg{display:block;flex:0 0 auto}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
mark{background:color-mix(in srgb,var(--c,var(--ren)) 20%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.c-add{--c:var(--add)} .c-del{--c:var(--del)} .c-ren{--c:var(--ren)} .c-size{--c:var(--size)} .c-time{--c:var(--time)}
.top{display:flex;align-items:baseline;gap:14px;padding:16px 28px 0;background:var(--band)}
.top .brand{font-weight:700;font-size:14px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--sv);white-space:nowrap}
.sev i{width:8px;height:8px;border-radius:50%;background:var(--sv)}
.sev.ok{--sv:var(--ok)} .sev.warn{--sv:var(--warn)} .sev.bad{--sv:var(--bad)}
.head{font-size:18px;font-weight:700;min-width:0}
.top .ba{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
/* the band */
.band{position:relative;padding:8px 28px 0;background:var(--band);border-bottom:1px solid var(--line2);user-select:none}
.track{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:150px;margin-right:150px}
.col{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:34px;cursor:pointer}
.col:hover .bars{filter:brightness(.95)}
.col .tot{position:relative;z-index:1;font-family:var(--num);font-size:13px;color:var(--muted);margin-bottom:5px;text-shadow:0 0 2px var(--band),0 0 4px var(--band),0 0 6px var(--band)}
.col .bars{width:min(46px,46%);display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden;transform-origin:50% 100%}
.col .bars span{display:block;background:var(--c)}
.col .zero{width:min(46px,46%);height:2px;background:var(--line2)}
.col .lab{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);white-space:nowrap}
.col .lab b{font-family:var(--num);font-weight:600;color:var(--ink2)}
.col.in .tot,.col.in .lab b{color:var(--ink)}
.bracket{position:absolute;top:0;bottom:28px;border-radius:8px;background:color-mix(in srgb,var(--ink) 6%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 22%,transparent);pointer-events:none;transition:left 300ms cubic-bezier(.2,.8,.2,1),width 300ms cubic-bezier(.2,.8,.2,1)}
.scrub{position:absolute;top:-2px;bottom:22px;width:2px;background:var(--sel);margin-left:-1px;transition:left 260ms cubic-bezier(.2,.8,.2,1);cursor:ew-resize;pointer-events:auto}
.scrub.drag{transition:none}
.scrub::after{content:"";position:absolute;left:50%;top:-7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--sel);box-shadow:0 0 0 3px var(--band)}
.presets{position:absolute;right:28px;top:14px;display:flex;flex-direction:column;gap:6px;width:130px}
.pb{padding:7px 12px;border-radius:8px;border:1px solid var(--line2);font-size:12.5px;color:var(--ink2);background:#fff}
.pb[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.legend{display:flex;gap:14px;padding:0 0 10px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;background:var(--c)}
/* the feed */
.feed{flex:1;min-height:0;overflow:auto;padding:0 28px 60px;scroll-behavior:auto}
.day{position:relative}
.dh{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:12px;padding:14px 0 8px;background:linear-gradient(var(--bg) 80%,transparent)}
.dh b{font-size:16px;font-weight:700}
.dh span{color:var(--muted);font-size:12px}
.dpt{display:flex;align-items:baseline;gap:8px;margin:10px 0 2px 120px;font-size:12px;color:var(--muted)}
.dpt b{color:var(--ink2);font-weight:700}
.ent{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:2px 14px;width:100%;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ent:hover{background:linear-gradient(90deg,transparent,#fff 10%,#fff 90%,transparent)}
.ent.sel{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 10%,#fff) 10%,color-mix(in srgb,var(--c) 10%,#fff) 90%,transparent)}
.ent .k{font-size:12px;font-weight:700;color:var(--c);display:flex;align-items:center;gap:7px;justify-self:end;white-space:nowrap}
.ent .k::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.ent .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ent .t s{text-decoration:none;color:var(--muted);font-weight:400}
.ent .m{font-size:12px;color:var(--muted);white-space:nowrap}
.ent .w{grid-column:2 / 4;font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail{position:absolute;left:118px;top:0;bottom:0;width:1px;background:var(--line2)}
.more{display:block;margin:10px 0 0 126px;padding:4px 12px;border-radius:999px;border:1px solid var(--line2);font-size:12px;background:#fff}
.empty{margin:30px 0 0 126px;color:var(--muted)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(30,30,25,.18);opacity:0;pointer-events:none;transition:opacity 260ms ease;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,92vw);background:#fff;z-index:21;box-shadow:-20px 0 50px -24px rgba(0,0,0,.35);transform:translateX(104%);transition:transform 320ms cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:flex-start;gap:10px;padding:20px 22px 12px;border-bottom:1px solid var(--line)}
.drawer header div{flex:1;min-width:0}
.drawer .kd{font-size:12px;font-weight:700;color:var(--c)}
.drawer h2{margin:4px 0 0;font-size:19px;line-height:1.4;overflow-wrap:anywhere}
.drawer .dp{font-size:12px;color:var(--muted)}
.x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--bg);color:var(--ink)}
.dbody{flex:1;overflow:auto;padding:18px 22px 30px}
.life{position:relative;padding-left:30px}
.life::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--line2),var(--c))}
.node{position:relative;margin-bottom:18px}
.node::before{content:"";position:absolute;left:-27px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line2)}
.node.after::before{border-color:var(--c);background:var(--c)}
.node .when{font-family:var(--num);font-size:12px;color:var(--muted)}
.node .nm{font-size:15px;font-weight:700;margin:2px 0 4px;overflow-wrap:anywhere}
.node .none{font-size:15px;color:var(--faint);margin:2px 0}
.node dl{display:grid;grid-template-columns:58px minmax(0,1fr);gap:3px 10px;margin:0;font-size:12px}
.node dt{color:var(--faint)} .node dd{margin:0;overflow-wrap:anywhere}
.node .p{color:var(--muted)} .node .p mark{color:var(--ink)}
.sep{font-style:normal;color:var(--faint);margin:0 3px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line2);border-radius:8px;font-size:12px;background:#fff}
.btn:hover{border-color:var(--ink2)}
.btn.done{color:var(--ok);border-color:var(--ok)}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
.files{margin-top:14px;border-top:1px solid var(--line)}
.files button{display:flex;gap:8px;width:100%;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.files button span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files button span:last-child{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* phones: the headline gets its own line, the range buttons go under the band, the feed's left column narrows */
@media (max-width:640px){
  .top{flex-wrap:wrap;gap:2px 10px;padding:12px 16px 0}
  .head{flex:1 1 100%;font-size:16px}
  .top .ba{margin-left:0}
  .band{padding:8px 16px 0}
  .legend{flex-wrap:wrap;gap:4px 12px}
  .track{margin-right:0}
  .col .lab{font-size:0}
  .col .lab b{font-size:10.5px}
  .presets{position:static;flex-direction:row;width:auto;padding:2px 0 12px}
  .feed{padding:0 16px 60px}
  .ent{grid-template-columns:84px minmax(0,1fr) auto;gap:2px 10px}
  .rail{left:90px}
  .dpt{margin-left:98px}
  .more,.empty{margin-left:98px}
}
</style>

const BATCH_VERB = { add: '新增', del: '刪除', ren: '改名或搬進來', size: '大小變了', time: '只改了修改時間' };
// up to n things worth looking at first: whole folders gone, files deleted, folders renamed, new folders
function notable(R, n = 3) {
  const out = [], B = rangeBatches(R);
  for (const e of R.ev) {
    if (e.k === 'fdel') out.push({ e, s: 1e8 + e.n });
    else if (e.k === 'fren') out.push({ e, s: 3e7 + e.n });
    else if (e.k === 'fadd') out.push({ e, s: 1e7 + e.n });
    else if (e.k === 'del' && !B.has(batchKey(e))) out.push({ e, s: 5e7 + Math.min(e.s / 1e3, 1e6) });
    else if (e.k === 'mov') out.push({ e, s: 1e6 });
  }
  for (const b of B.values()) if (b.g === 'del') out.push({ b, s: 6e7 + b.n });
  return out.sort((x, y) => y.s - x.s).slice(0, n);
}
// departments with changes (deletions first, then by volume) and the quiet ones
function deptOrder(R) {
  const M = summary(R);
  const idx = DATA.depts.map((d, i) => i);
  return {
    busy: idx.filter(i => M.dept[i].total > 0).sort((x, y) => (M.dept[y].del > 0) - (M.dept[x].del > 0) || M.dept[y].total - M.dept[x].total),
    quiet: idx.filter(i => M.dept[i].total === 0),
  };
}
const eventsOf = (R, f = {}) => { summary(R); return R.ev.filter(e => (f.d == null || e.d === f.d) && (f.g == null || gOf(e) === f.g)); };
const filesOf = list => list.reduce((a, e) => a + cnt(e), 0);

// what a row says about itself: title (with old → new), where, size note
function rowText(e) {
  const g = gOf(e);
  const name = e.k === 'fren' || e.k === 'ren' || (e.k === 'mov' && e.nm)
    ? (baseOf(e.p0) === baseOf(e.p) ? { now: baseOf(e.p) } : { old: baseOf(e.p0), now: baseOf(e.p) })
    : { now: baseOf(e.p) };
  let place = where(dirOf(e.p));
  if (e.k === 'mov' || (e.k === 'fren' && e.mv)) place = `從 ${where(dirOf(e.p0))} 到 ${where(dirOf(e.p))}`;
  const meta = e.n ? `${fmtNum(e.n)} 個檔 · ${fmtBytes(e.b)}` : e.k === 'size' ? fmtDelta(e.s1 - e.s0) : e.k === 'time' ? fmtTime(e.t1) : fmtBytes(e.s);
  return { g, label: typeLabel(e), name, place, meta, folder: !!e.n };
}
function batchText(b) {
  return { g: b.g, label: `${BATCH_VERB[b.g]} ${fmtNum(b.n)} 個檔`, name: { now: baseOf(b.p) || '（部門最上層）' }, place: where(dirOf(b.p)),
    meta: b.g === 'size' ? fmtDelta(b.b) : b.g === 'time' ? '' : fmtBytes(b.b), folder: true };
}

// before | after for one change (or one file inside a folder change)
function snapPath(rel, point) { return (DATA.snapRoot || `${DATA.drive}\\@Recently-Snapshot\\{snap}`).replace('{snap}', point.snap) + '\\' + rel; }
function detailModel(e, child, R) {
  const A = R.before, B = R.after;
  let f = e, p0 = e.p0 || e.p, p1 = e.p;
  if (child) { f = child; p0 = (e.p0 || e.p) + '\\' + child.r; p1 = e.p + '\\' + child.r; }
  const isFolder = !child && !!e.n;
  const kind = child ? (e.k === 'fadd' ? '新增' : e.k === 'fdel' ? '刪除' : e.mv ? '跟著資料夾搬移' : '跟著資料夾改名') : typeLabel(e);
  const had = !(e.k === 'add' || e.k === 'fadd'), has = !(e.k === 'del' || e.k === 'fdel');
  const sA = child ? f.s : e.k === 'size' ? e.s0 : isFolder ? e.b : e.s;
  const sB = child ? f.s : e.k === 'size' ? e.s1 : isFolder ? e.b : e.s;
  const tA = child ? f.t : (e.t0 ?? e.t), tB = child ? f.t : (e.t1 ?? e.t);
  return { e, g: gOf(e), kind, isFolder, had, has, p0, p1, nameA: baseOf(p0), nameB: baseOf(p1), dirA: dirOf(p0), dirB: dirOf(p1),
    sA, sB, tA, tB, n: e.n, files: isFolder ? (e.f || []) : null, dept: deptName(e.d), A, B,
    nowPath: `${DATA.drive}\\${p1}`, oldPath: snapPath(p0, A) };
}
function nameMarks(a, b) {
  if (a === b) return [esc(a), esc(b)];
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  let j = 0; while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
  const m = s => esc(s.slice(0, i)) + (s.length - j > i ? `<mark>${esc(s.slice(i, s.length - j))}</mark>` : '') + esc(s.slice(s.length - j));
  return [m(a), m(b)];
}
// path as segments; segments after the first difference are marked
function pathHtml(p, other, sep = '<i class="sep">/</i>') {
  const a = segs(p), b = other == null ? a : segs(other);
  let k = 0; while (k < a.length && k < b.length && a[k] === b[k]) k++;
  return a.map((s, i) => i >= k ? `<mark>${esc(s)}</mark>` : `<span>${esc(s)}</span>`).join(sep);
}
function copyText(v) {
  return (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).catch(() => {
    const ta = document.createElement('textarea'); ta.value = v; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  });
}
// a copy button that says 已複製 for a moment
function wireCopy(root) {
  root.addEventListener('click', ev => {
    const t = ev.target.closest('[data-copy]'); if (!t) return;
    ev.stopPropagation();
    copyText(t.dataset.copy).then(() => { const old = t.innerHTML; t.classList.add('done'); t.innerHTML = ICON.ok + '已複製'; setTimeout(() => { t.classList.remove('done'); t.innerHTML = old; }, 1400); });
  });
}
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
// run a WAAPI animation and always finish within ms+250 even when the page is not painting
function animate(el, frames, opts) {
  if (reduceMotion() || !el.animate) return Promise.resolve();
  const a = el.animate(frames, { fill: 'none', ...opts });
  return new Promise(res => { let done = false; const fin = () => { if (!done) { done = true; res(); } }; a.onfinish = fin; a.oncancel = fin; setTimeout(fin, (opts.duration || 300) + (opts.delay || 0) + 250); });
}

const S = { R: null, shown: {}, stack: [] };
const $ = id => document.getElementById(id);
const dayIds = () => DATA.days.map(d => d.range);
const daysOfRange = R => R.kind === 'day' ? [R.id] : (R.days || []);

function renderTop() {
  const R = S.R, H = headline(R), a = R.before, b = R.after;
  $('top').innerHTML = `<span class="brand">Z:\\ 時間軸</span><span class="sev ${H.lv}"><i></i>${H.lvText}</span><span class="head">${esc(H.head)}</span>
    <span class="ba num">${fmtNum(a.files)} → ${fmtNum(b.files)} 個檔（${fmtSigned(b.files - a.files)}）</span>`;
}
function renderBand(grow) {
  const max = Math.max(1, ...DATA.days.map(d => d.c.total));
  const inR = new Set(daysOfRange(S.R));
  let cols = DATA.days.map(d => {
    const M = summary(rangeById(d.range));
    const h = d.c.total ? Math.max(4, d.c.total / max * 84) : 0;
    const parts = ['del', 'ren', 'size', 'add'].filter(g => M.by[g]).map(g => `<span class="c-${g}" style="height:${(M.by[g] / d.c.total * h).toFixed(1)}px"></span>`).join('');
    return `<div class="col${inR.has(d.range) ? ' in' : ''}" data-day="${esc(d.range)}"><span class="tot">${fmtNum(d.c.total)}</span>${h ? `<span class="bars">${parts}</span>` : '<span class="zero"></span>'}<span class="lab"><b>${esc(d.md)}</b> ${esc(d.wk)}</span></div>`;
  }).join('');
  const pre = DATA.presets.filter(p => !p.startsWith('day:'));
  $('band').innerHTML = `<div class="legend">${['del', 'ren', 'size', 'add'].map(g => `<span class="c-${g}"><i></i>${GL[g]}</span>`).join('')}</div>
    <div class="track" id="track">${cols}<div class="bracket" id="bracket"></div><div class="scrub" id="scrub" role="slider" aria-label="選一天" tabindex="0"></div></div>
    <div class="presets">${pre.map(id => `<button class="pb" data-range="${esc(id)}" aria-pressed="${S.R.id === id}">${esc(rangeById(id).short)}</button>`).join('')}</div>`;
  placeBracket();
  if (grow) [...document.querySelectorAll('.col .bars')].forEach((el, k) => animate(el, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 520, delay: k * 50, easing: 'cubic-bezier(.2,.9,.25,1)', fill: 'backwards' }));
}
function colRect(id) { const c = document.querySelector(`.col[data-day="${CSS.escape(id)}"]`); return c ? { left: c.offsetLeft, width: c.offsetWidth } : null; }
function placeBracket(focusDay) {
  const ids = daysOfRange(S.R).filter(id => colRect(id));
  if (!ids.length) return;
  const rs = ids.map(colRect), l = Math.min(...rs.map(r => r.left)), rgt = Math.max(...rs.map(r => r.left + r.width));
  Object.assign($('bracket').style, { left: l + 4 + 'px', width: rgt - l - 8 + 'px' });
  const f = colRect(focusDay || ids[ids.length - 1]);
  $('scrub').style.left = f.left + f.width / 2 + 'px';
}

function entHtml(x, R) {
  const T = x.b ? batchText(x.b) : rowText(x.e);
  const nm = T.name.old ? `<s>${esc(T.name.old)}</s>　→　${esc(T.name.now)}` : esc(T.name.now) + (T.folder && !x.b ? '/' : '');
  return `<button class="ent c-${T.g}" ${x.b ? `data-batch="${esc(x.b.key)}"` : `data-ev="${x.e.i}"`} data-r="${esc(R.id)}"><span class="k">${esc(x.b ? BATCH_VERB[x.b.g] + ' ' + fmtNum(x.b.n) : T.label)}</span><span class="t">${nm}</span><span class="m num">${esc(T.meta)}</span><span class="w">${esc(T.place)}</span></button>`;
}
function dayHtml(R) {
  const M = summary(R), O = deptOrder(R);
  let html = `<section class="day" data-day="${esc(R.id)}"><div class="dh"><b>${esc(R.short)}</b><span class="num">${fmtNum(M.total)} 個檔有變化</span></div><div class="rail"></div>`;
  if (!M.total) return html + '<div class="empty">這一天沒有變化</div></section>';
  for (const d of O.busy) {
    const items = eventsOf(R, { d }).filter(e => gOf(e) !== 'time');
    const rank = { del: 0, ren: 1, size: 2, add: 3 };
    const rows = displayItems(R, items).sort((p, q) => rank[p.b ? p.b.g : gOf(p.e)] - rank[q.b ? q.b.g : gOf(q.e)] || q.n - p.n);
    const key = R.id + '|' + d, lim = S.shown[key] || 12;
    html += `<div class="dpt"><b>${esc(DATA.depts[d].name)}</b><span class="num">${fmtNum(filesOf(items))}</span></div>`;
    html += rows.slice(0, lim).map(x => entHtml(x, R)).join('');
    if (rows.length > lim) html += `<button class="more" data-more="${esc(key)}">再顯示 ${fmtNum(Math.min(40, rows.length - lim))} 則（還有 ${fmtNum(rows.length - lim)} 則）</button>`;
  }
  return html + '</section>';
}
function renderFeed(stagger) {
  const ids = daysOfRange(S.R).slice().reverse();
  $('feed').innerHTML = ids.map(id => dayHtml(rangeById(id))).join('') || '<div class="empty">沒有資料</div>';
  if (stagger) [...$('feed').querySelectorAll('.ent')].slice(0, 24).forEach((el, k) => animate(el, [{ transform: 'translateY(8px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 280, delay: 60 + k * 22, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
}
function setRange(id, opts = {}) {
  S.R = rangeById(id); S.shown = {}; tellRange(S.R);
  renderTop(); renderBand(opts.grow); renderFeed(true); $('feed').scrollTop = 0;
}
// in a multi-day view the scrubber follows the day you are reading, and dragging it jumps the feed
function focusDay(dayId, smooth) {
  if (S.R.kind === 'day') { if (dayId !== S.R.id) setRange(dayId); return; }
  if (!daysOfRange(S.R).includes(dayId)) { setRange(dayId); return; }
  const sec = $('feed').querySelector(`.day[data-day="${CSS.escape(dayId)}"]`);
  if (sec) $('feed').scrollTo({ top: sec.offsetTop, behavior: smooth && !reduceMotion() ? 'smooth' : 'auto' });
  placeBracket(dayId);
}
$('feed').addEventListener('scroll', () => {
  if (S.R.kind === 'day') return;
  const y = $('feed').scrollTop + 30; let cur = null;
  for (const s of $('feed').querySelectorAll('.day')) if (s.offsetTop <= y) cur = s.dataset.day;
  if (cur) { const f = colRect(cur); if (f && !$('scrub').classList.contains('drag')) $('scrub').style.left = f.left + f.width / 2 + 'px'; }
}, { passive: true });
$('band').addEventListener('pointerdown', ev => {
  const scrub = ev.target.closest('.scrub'); if (!scrub) return;
  const track = $('track'), T = track.getBoundingClientRect();
  scrub.classList.add('drag');
  try { scrub.setPointerCapture(ev.pointerId); } catch {}
  const pickAt = x => { const cols = [...track.querySelectorAll('.col')]; let best = cols[0], bd = 1e9; for (const c of cols) { const cx = c.offsetLeft + c.offsetWidth / 2, dd = Math.abs(cx - x); if (dd < bd) { bd = dd; best = c; } } return best; };
  const mv = e => { const x = Math.max(0, Math.min(T.width, e.clientX - T.left)); scrub.style.left = x + 'px'; };
  const up = e => {
    scrub.classList.remove('drag');
    scrub.removeEventListener('pointermove', mv); scrub.removeEventListener('pointerup', up); scrub.removeEventListener('pointercancel', up);
    const c = pickAt(Math.max(0, Math.min(T.width, e.clientX - T.left)));
    focusDay(c.dataset.day, true);
  };
  scrub.addEventListener('pointermove', mv); scrub.addEventListener('pointerup', up); scrub.addEventListener('pointercancel', up);
});
$('band').addEventListener('keydown', ev => {
  if (!ev.target.closest('.scrub') || (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight')) return;
  const ids = dayIds(), cur = S.R.kind === 'day' ? S.R.id : ids[ids.length - 1];
  const k = Math.max(0, Math.min(ids.length - 1, ids.indexOf(cur) + (ev.key === 'ArrowLeft' ? -1 : 1)));
  setRange(ids[k]);
});

// ---- drawer ----
function lifeHtml(D) {
  const both = D.had && D.has;
  const node = side => {
    const has = side === 'b' ? D.had : D.has, at = side === 'b' ? D.A.at : D.B.at;
    const when = `<div class="when">${side === 'b' ? '之前' : '之後'}　${fmtMD(at)} ${fmtHM(at)}</div>`;
    if (!has) return `<div class="node ${side === 'b' ? 'before' : 'after'}">${when}<div class="none">${side === 'b' ? '還沒有' : '不在了'}</div></div>`;
    const [ma, mb] = nameMarks(D.nameA, D.nameB);
    const dir = side === 'b' ? D.dirA : D.dirB, other = side === 'b' ? D.dirB : D.dirA;
    const s = side === 'b' ? D.sA : D.sB, t = side === 'b' ? D.tA : D.tB;
    return `<div class="node ${side === 'b' ? 'before' : 'after'}">${when}<div class="nm">${side === 'b' ? ma : mb}${D.isFolder ? '/' : ''}</div><dl>
      <dt>位置</dt><dd class="p">${both && side === 'a' && dir === other ? '沒換位置' : pathHtml(dir || '（最上層）', both ? other : null)}</dd>
      <dt>${D.isFolder ? '內容' : '大小'}</dt><dd class="num">${D.isFolder ? fmtNum(D.n) + ' 個檔 · ' : ''}${fmtBytes(s)}${side === 'a' && both && D.sA !== D.sB ? `（${fmtDelta(D.sB - D.sA)}）` : ''}</dd>
      ${D.isFolder ? '' : `<dt>修改時間</dt><dd class="num">${fmtTime(t)}</dd>`}</dl></div>`;
  };
  return `<div class="life c-${D.g}">${node('b')}${node('a')}</div>`;
}
function openDrawer(spec) {
  S.stack.push(spec); drawDrawer();
  $('drawer').classList.add('on'); $('drawer').setAttribute('aria-hidden', 'false'); $('scrim').classList.add('on');
}
function closeDrawer() {
  S.stack = []; $('drawer').classList.remove('on'); $('drawer').setAttribute('aria-hidden', 'true'); $('scrim').classList.remove('on');
  document.querySelectorAll('.ent.sel').forEach(x => x.classList.remove('sel'));
}
function drawDrawer() {
  const sp = S.stack[S.stack.length - 1], R = sp.R;
  const back = S.stack.length > 1 ? `<button class="back" data-back>${ICON.back}回到 ${esc(S.stack[S.stack.length - 2].title)}</button>` : '';
  let head, body;
  if (sp.b) {
    const b = sp.b;
    head = `<div class="kd c-${b.g}">這個資料夾${esc(BATCH_VERB[b.g])} ${fmtNum(b.n)} 個檔</div><h2>${esc(baseOf(b.p) || '（部門最上層）')}/</h2><div class="dp">${esc(deptName(b.d))} · ${esc(R.short)}</div>`;
    body = `<div class="acts" style="margin:0 0 10px"><button class="btn" data-copy="${esc(DATA.drive + '\\' + b.p)}">${ICON.copy}複製資料夾的位置</button></div>${b.items.slice().sort((p, q) => (baseOf(p.p) < baseOf(q.p) ? -1 : 1)).map(e => entHtml({ e }, R)).join('')}`;
  } else {
    const D = detailModel(sp.e, sp.child, R);
    head = `<div class="kd c-${D.g}">${esc(D.kind)}</div><h2>${esc(D.nameB)}${D.isFolder ? '/' : ''}</h2><div class="dp">${esc(D.dept)} · ${esc(R.short)}</div>`;
    body = lifeHtml(D) + `<div class="acts">${D.has ? `<button class="btn" data-copy="${esc(D.nowPath)}">${ICON.copy}複製現在的位置</button>` : ''}${D.had ? `<button class="btn" data-copy="${esc(D.oldPath)}">${ICON.copy}複製 ${fmtMD(D.A.at)} 快照裡的位置</button>` : ''}</div>`;
    if (!D.has) body += `<div class="hint">${fmtMD(D.A.at)} 凌晨的快照裡還有，複製位置貼到檔案總管就能找回來。</div>`;
    if (sp.e.k === 'mov' && !sp.e.sure && !sp.child) body += '<div class="hint">名字和位置都不一樣，是靠大小與修改時間配起來的，可能不是同一個檔。</div>';
    if (D.isFolder) body += `<div class="files">${D.files.slice(0, 300).map((f, k) => `<button data-file="${k}"><span>${esc(f.r.split('\\').join(' / '))}</span><span class="num">${fmtBytes(f.s)}</span></button>`).join('')}</div>`;
  }
  $('drawer').innerHTML = `<header class="c-${sp.b ? sp.b.g : gOf(sp.e)}"><div>${head}</div><button class="x" data-close aria-label="關閉">${ICON.x}</button></header><div class="dbody">${back}${body}</div>`;
  const db = $('drawer').querySelector('.dbody');
  animate(db, [{ transform: 'translateX(14px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 240, easing: 'cubic-bezier(.2,.8,.2,1)' });
}
document.addEventListener('click', ev => {
  const t = ev.target;
  if (t.closest('[data-copy]')) return;
  if (t.closest('#scrim') || t.closest('[data-close]')) { closeDrawer(); return; }
  if (t.closest('[data-back]')) { S.stack.pop(); drawDrawer(); return; }
  const r = t.closest('[data-range]'); if (r) { setRange(r.dataset.range); return; }
  const col = t.closest('.col'); if (col) { focusDay(col.dataset.day, true); return; }
  const m = t.closest('[data-more]'); if (m) { S.shown[m.dataset.more] = (S.shown[m.dataset.more] || 12) + 40; const y = $('feed').scrollTop; renderFeed(false); $('feed').scrollTop = y; return; }
  const b = t.closest('[data-batch]');
  if (b) { const R = rangeById(b.dataset.r) || S.R, bb = rangeBatches(R).get(b.dataset.batch); document.querySelectorAll('.ent.sel').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); openDrawer({ R, b: bb, title: baseOf(bb.p) || '最上層' }); return; }
  const e = t.closest('[data-ev]');
  if (e) { const R = rangeById(e.dataset.r) || S.R, ee = R.ev[+e.dataset.ev]; if (!t.closest('.drawer')) { document.querySelectorAll('.ent.sel').forEach(x => x.classList.remove('sel')); e.classList.add('sel'); } openDrawer({ R, e: ee, title: baseOf(ee.p) }); return; }
  const f = t.closest('[data-file]');
  if (f) { const sp = S.stack[S.stack.length - 1], k = +f.dataset.file; openDrawer({ R: sp.R, e: sp.e, child: sp.e.f[k], title: baseOf(sp.e.f[k].r) }); }
});
wireCopy(document);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.stack.length) { if (S.stack.length > 1) { S.stack.pop(); drawDrawer(); } else closeDrawer(); } });
addEventListener('resize', () => placeBracket());
zmonBoot(() => setRange(startRange(), { grow: true }));
</script>
