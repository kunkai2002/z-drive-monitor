<style>
:root{--news:#efe9dc;--sheet:#f8f4ea;--ink:#1c1a16;--ink2:#3b372f;--muted:#6e675a;--faint:#9d9584;--rule:#2a2722;--line:#d6cdbb;
  --add:#4f6d3a;--del:#8f2f1f;--ren:#2f4f6b;--size:#86591a;--time:#7d776b;--ok:#4a6b42;--warn:#9a6413;--bad:#8b2f1f;
  --serif:"Noto Serif TC","Source Han Serif TC","PMingLiU",Georgia,serif;--sans:"Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans TC",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--news);color:var(--ink);font:14px/1.7 var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--ren);outline-offset:2px}
svg{display:block;flex:0 0 auto}
.num{font-variant-numeric:tabular-nums}
.c-add{--c:var(--add)} .c-del{--c:var(--del)} .c-ren{--c:var(--ren)} .c-size{--c:var(--size)} .c-time{--c:var(--time)}
mark{background:color-mix(in srgb,var(--c,var(--ren)) 18%,transparent);color:inherit;padding:0 1px}
.desk{height:100%;overflow:auto;transition:transform 420ms cubic-bezier(.2,.8,.2,1),filter 420ms ease;transform-origin:50% 30%}
.desk.back{transform:scale(.985);filter:brightness(.9) saturate(.9)}
.front{max-width:1200px;margin:22px auto 60px;background:var(--sheet);padding:22px 40px 40px;box-shadow:0 1px 1px rgba(40,30,10,.06),0 24px 60px -40px rgba(40,30,10,.45)}
.mast{text-align:center;border-top:4px solid var(--rule);padding-top:10px}
.mast h1{font-size:56px;line-height:1.1;margin:4px 0 6px;letter-spacing:.3em;font-weight:900;text-indent:.3em}
.dateline{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;border-top:1px solid var(--rule);border-bottom:3px double var(--rule);padding:5px 0;font-family:var(--sans);font-size:12px;color:var(--ink2)}
.dateline span:first-child{text-align:left} .dateline span:last-child{text-align:right}
.eds{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;padding:7px 0 0;font-family:var(--sans);font-size:12px;color:var(--muted)}
.eds button{color:var(--muted)} .eds button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.eds button[aria-pressed="true"]{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.lead{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:0 32px;padding:20px 0 18px;border-bottom:1px solid var(--rule)}
.kicker{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--sv,var(--muted))}
.kicker.ok{--sv:var(--ok)} .kicker.warn{--sv:var(--warn)} .kicker.bad{--sv:var(--bad)}
.hl{font-size:40px;line-height:1.25;margin:6px 0 10px;font-weight:900;letter-spacing:.01em}
.hl button:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.stand{font-size:16px;line-height:1.8;color:var(--ink2);text-align:justify;margin:0}
.stand .num{font-family:var(--sans);font-size:14px}
.box{border:1px solid var(--rule);padding:12px 14px;align-self:start;background:#fbf8f0}
.box h4{margin:0 0 8px;font-family:var(--sans);font-size:11.5px;letter-spacing:.2em;color:var(--muted)}
.box table{width:100%;border-collapse:collapse;font-size:13px}
.box td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top;overflow-wrap:anywhere}
.box td:first-child{width:46px;font-family:var(--sans);font-size:11.5px;color:var(--faint)}
.box .none{color:var(--faint)}
.box .go{display:inline-block;margin-top:8px;font-family:var(--sans);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding-top:12px}
.colm{padding:0 16px;border-left:1px solid var(--line);min-width:0}
.colm:first-child{border-left:0;padding-left:0} .colm:last-child{padding-right:0}

.news{display:block;width:100%;padding:7px 0;border-bottom:1px solid var(--line)}
.news:hover b{text-decoration:underline;text-underline-offset:4px}
.news b{display:block;font-size:14.5px;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.news b s{text-decoration:none;font-weight:400;color:var(--muted)}
.news > span{display:block;font-family:var(--sans);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news .meta{display:inline;color:var(--c)}
.allx{display:inline-block;margin-top:6px;font-family:var(--sans);font-size:12px;text-decoration:underline;text-underline-offset:3px;color:var(--ink2)}
.nil{font-family:var(--sans);font-size:12px;color:var(--faint);padding:6px 0}
.index{margin-top:18px;border-top:3px double var(--rule);padding-top:8px}
.index h3{margin:0 0 6px;font-size:14px;font-weight:900;letter-spacing:.3em}
.ix{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 24px}
.ixr{display:flex;align-items:baseline;gap:6px;padding:4px 0;font-size:14px}
.ixr::after{content:"";order:2;flex:1;border-bottom:1px dotted var(--faint);transform:translateY(-4px)}
.ixr b{order:1;font-weight:700} .ixr span{order:3;font-family:var(--sans);font-size:12px}
.ixr:hover b{text-decoration:underline;text-underline-offset:3px}
.quiet{font-family:var(--sans);font-size:12px;color:var(--faint);margin-top:6px}

.art{position:fixed;left:50%;bottom:0;width:min(980px,96vw);height:92vh;transform:translate(-50%,104%);background:var(--sheet);box-shadow:0 -24px 60px -20px rgba(30,20,0,.4);transition:transform 440ms cubic-bezier(.2,.8,.2,1);z-index:10;display:flex;flex-direction:column}
.art.on{transform:translate(-50%,0)}
.art .bar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--rule);font-family:var(--sans);font-size:12px;color:var(--muted)}
.art .bar .sp{flex:1}
.art .x{width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.art .x:hover{background:var(--news)}
.art .back{display:inline-flex;align-items:center;gap:4px}
.art .body{flex:1;overflow:auto;padding:26px 48px 50px}
.art .kk{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--c)}
.art h2{font-size:34px;line-height:1.3;margin:6px 0 4px;font-weight:900;overflow-wrap:anywhere}

.pull{font-size:22px;line-height:1.5;font-weight:700;text-align:center;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule);padding:12px 10px;margin:4px 0 18px;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.two > div{min-width:0}
.two > div + div{border-left:1px solid var(--line);padding-left:32px}
.two h4{margin:0 0 6px;font-family:var(--sans);font-size:12px;letter-spacing:.24em;color:var(--muted)}
.two p{margin:0 0 8px;font-size:15px;line-height:1.85;text-align:justify}
.two .none{color:var(--faint)}
.two .p{font-family:var(--sans);font-size:12.5px;color:var(--muted);text-align:left} .two .p mark{color:var(--ink)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--rule);font-size:12px;background:var(--sheet)}
.btn:hover{background:#fff}
.btn.done{color:var(--ok);border-color:var(--ok)}
.hint{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:10px}
.ftab{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}

.ftab td{border-bottom:1px solid var(--line);padding:5px 4px}
.ftab td:last-child{font-family:var(--sans);font-size:12px;text-align:right;white-space:nowrap}
.ftab tr.click{cursor:pointer} .ftab tr.click:hover td{background:#fff}
.sect{columns:3 240px;column-gap:28px;column-rule:1px solid var(--line)}

.sect h5{break-after:avoid;margin:10px 0 2px;font-size:14px;font-weight:900;color:var(--c)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  return out.sort((x, y) => y.n - x.n || (x.p < y.p ? -1 : x.p > y.p ? 1 : 0));
}
const BATCH_VERB = { add: '新增', del: '刪除', ren: '改名或搬進來', size: '大小變了', time: '只改了修改時間' };
// up to n things worth looking at first: whole folders gone, files deleted, folders renamed, new folders
function notable(R, n = 3) {
  const out = [], B = rangeBatches(R);
  for (const e of R.ev) {
    if (e.k === 'fdel') out.push({ e, s: 1e8 + e.n });
    else if (e.k === 'fren') out.push({ e, s: 3e7 + e.n });
    else if (e.k === 'fadd') out.push({ e, s: 1e7 + e.n });
    else if (e.k === 'del' && !B.has(batchKey(e))) out.push({ e, s: 5e7 + Math.min(e.s / 1e3, 1e6) });
    else if (e.k === 'mov') out.push({ e, s: 1e6 });
  }
  for (const b of B.values()) if (b.g === 'del') out.push({ b, s: 6e7 + b.n });
  return out.sort((x, y) => y.s - x.s).slice(0, n);
}
// departments with changes (deletions first, then by volume) and the quiet ones
function deptOrder(R) {
  const M = summary(R);
  const idx = DATA.depts.map((d, i) => i);
  return {
    busy: idx.filter(i => M.dept[i].total > 0).sort((x, y) => (M.dept[y].del > 0) - (M.dept[x].del > 0) || M.dept[y].total - M.dept[x].total),
    quiet: idx.filter(i => M.dept[i].total === 0),
  };
}
const eventsOf = (R, f = {}) => { summary(R); return R.ev.filter(e => (f.d == null || e.d === f.d) && (f.g == null || gOf(e) === f.g)); };
const filesOf = list => list.reduce((a, e) => a + cnt(e), 0);

// what a row says about itself: title (with old → new), where, size note
function rowText(e) {
  const g = gOf(e);
  const name = e.k === 'fren' || e.k === 'ren' || (e.k === 'mov' && e.nm)
    ? (baseOf(e.p0) === baseOf(e.p) ? { now: baseOf(e.p) } : { old: baseOf(e.p0), now: baseOf(e.p) })
    : { now: baseOf(e.p) };
  let place = where(dirOf(e.p));
  if (e.k === 'mov' || (e.k === 'fren' && e.mv)) place = `從 ${where(dirOf(e.p0))} 到 ${where(dirOf(e.p))}`;
  const meta = e.n ? `${fmtNum(e.n)} 個檔 · ${fmtBytes(e.b)}` : e.k === 'size' ? fmtDelta(e.s1 - e.s0) : e.k === 'time' ? fmtTime(e.t1) : fmtBytes(e.s);
  return { g, label: typeLabel(e), name, place, meta, folder: !!e.n };
}
function batchText(b) {
  return { g: b.g, label: `${BATCH_VERB[b.g]} ${fmtNum(b.n)} 個檔`, name: { now: baseOf(b.p) || '（部門最上層）' }, place: where(dirOf(b.p)),
    meta: b.g === 'size' ? fmtDelta(b.b) : b.g === 'time' ? '' : fmtBytes(b.b), folder: true };
}

// before | after for one change (or one file inside a folder change)
function snapPath(rel, point) { return (DATA.snapRoot || `${DATA.drive}\\@Recently-Snapshot\\{snap}`).replace('{snap}', point.snap) + '\\' + rel; }
function detailModel(e, child, R) {
  const A = R.before, B = R.after;
  let f = e, p0 = e.p0 || e.p, p1 = e.p;
  if (child) { f = child; p0 = (e.p0 || e.p) + '\\' + child.r; p1 = e.p + '\\' + child.r; }
  const isFolder = !child && !!e.n;
  const kind = child ? (e.k === 'fadd' ? '新增' : e.k === 'fdel' ? '刪除' : e.mv ? '跟著資料夾搬移' : '跟著資料夾改名') : typeLabel(e);
  const had = !(e.k === 'add' || e.k === 'fadd'), has = !(e.k === 'del' || e.k === 'fdel');
  const sA = child ? f.s : e.k === 'size' ? e.s0 : isFolder ? e.b : e.s;
  const sB = child ? f.s : e.k === 'size' ? e.s1 : isFolder ? e.b : e.s;
  const tA = child ? f.t : (e.t0 ?? e.t), tB = child ? f.t : (e.t1 ?? e.t);
  return { e, g: gOf(e), kind, isFolder, had, has, p0, p1, nameA: baseOf(p0), nameB: baseOf(p1), dirA: dirOf(p0), dirB: dirOf(p1),
    sA, sB, tA, tB, n: e.n, files: isFolder ? (e.f || []) : null, dept: deptName(e.d), A, B,
    nowPath: `${DATA.drive}\\${p1}`, oldPath: snapPath(p0, A) };
}
function nameMarks(a, b) {
  if (a === b) return [esc(a), esc(b)];
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  let j = 0; while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
  const m = s => esc(s.slice(0, i)) + (s.length - j > i ? `<mark>${esc(s.slice(i, s.length - j))}</mark>` : '') + esc(s.slice(s.length - j));
  return [m(a), m(b)];
}
// path as segments; segments after the first difference are marked
function pathHtml(p, other, sep = '<i class="sep">/</i>') {
  const a = segs(p), b = other == null ? a : segs(other);
  let k = 0; while (k < a.length && k < b.length && a[k] === b[k]) k++;
  return a.map((s, i) => i >= k ? `<mark>${esc(s)}</mark>` : `<span>${esc(s)}</span>`).join(sep);
}
function copyText(v) {
  return (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).catch(() => {
    const ta = document.createElement('textarea'); ta.value = v; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  });
}
// a copy button that says 已複製 for a moment
function wireCopy(root) {
  root.addEventListener('click', ev => {
    const t = ev.target.closest('[data-copy]'); if (!t) return;
    ev.stopPropagation();
    copyText(t.dataset.copy).then(() => { const old = t.innerHTML; t.classList.add('done'); t.innerHTML = ICON.ok + '已複製'; setTimeout(() => { t.classList.remove('done'); t.innerHTML = old; }, 1400); });
  });
}
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
// run a WAAPI animation and always finish within ms+250 even when the page is not painting
function animate(el, frames, opts) {
  if (reduceMotion() || !el.animate) return Promise.resolve();
  const a = el.animate(frames, { fill: 'none', ...opts });
  return new Promise(res => { let done = false; const fin = () => { if (!done) { done = true; res(); } }; a.onfinish = fin; a.oncancel = fin; setTimeout(fin, (opts.duration || 300) + (opts.delay || 0) + 250); });
}

const S = { R: null, stack: [] };
const $ = id => document.getElementById(id);
const Q = s => `「${s}」`;

function leadOf(R) {
  const n = notable(R, 1)[0];
  if (!n) return null;
  const { e, b } = n;
  if (b) return { x: n, g: b.g, hl: `${deptName(b.d)}從${Q(baseOf(b.p))}刪了 ${fmtNum(b.n)} 個檔`, st: `${R.phrase}，${deptName(b.d)}的${Q(baseOf(b.p))}資料夾裡有 ${fmtNum(b.n)} 個檔不見了。` };
  const dn = deptName(e.d), nm = baseOf(e.p);
  if (e.k === 'fdel') return { x: n, g: 'del', hl: `${dn}一整個資料夾不見了`, st: `${Q(nm)}裡的 ${fmtNum(e.n)} 個檔在 ${R.phrase}被刪，${fmtMD(R.before.at)} 凌晨的快照裡還找得到。` };
  if (e.k === 'del') return { x: n, g: 'del', hl: `${dn}刪了${Q(nm)}`, st: `${Q(nm)}（${fmtBytes(e.s)}）在 ${R.phrase}被刪，快照裡還找得到。` };
  if (e.k === 'fren') return { x: n, g: 'ren', hl: baseOf(e.p0) === nm ? `${dn}把${Q(nm)}搬了位置` : `${dn}把${Q(baseOf(e.p0))}改名為${Q(nm)}`, st: `資料夾裡的 ${fmtNum(e.n)} 個檔都還在，只是${baseOf(e.p0) === nm ? '換了位置' : '換了名字'}。` };
  if (e.k === 'fadd') return { x: n, g: 'add', hl: `${dn}新增資料夾${Q(nm)}`, st: `裡面有 ${fmtNum(e.n)} 個檔，共 ${fmtBytes(e.b)}。` };
  return { x: n, g: gOf(e), hl: `${dn}${typeLabel(e)}${Q(nm)}`, st: `${R.phrase}的變化。` };
}
function newsHtml(x) {
  const T = x.b ? batchText(x.b) : rowText(x.e);
  const nm = T.name.old ? `<s>${esc(T.name.old)}</s> → ${esc(T.name.now)}` : esc(T.name.now) + (T.folder && !x.b ? '/' : '');
  return `<button class="news c-${T.g}" ${x.b ? `data-batch="${esc(x.b.key)}"` : `data-ev="${x.e.i}"`}><b>${nm}</b><span><span class="meta">${esc(x.b ? T.label : T.label)}</span> · ${esc(deptName(x.b ? x.b.d : x.e.d))} · ${esc(T.meta)}</span></button>`;
}
function renderFront(anim) {
  const R = S.R, M = summary(R), H = headline(R), O = deptOrder(R), L = leadOf(R);
  const eds = [...DATA.days.map(d => d.range), ...DATA.presets.filter(p => !p.startsWith('day:'))];
  let html = `<header class="mast"><h1>Z:\\ 日報</h1>
    <div class="dateline"><span>${esc(DATA.shareName)}</span><span>${esc(fmtLongDate(R.after.at))}</span><span class="num">比較 ${esc(R.span)}</span></div>
    <nav class="eds">往期　${eds.map(id => `<button class="num" data-range="${esc(id)}" aria-pressed="${S.R.id === id}">${esc(rangeById(id).short)}</button>`).join('')}</nav></header>`;
  if (L) {
    const D = L.x.e ? detailModel(L.x.e, null, R) : null;
    const box = D ? `<table><tr><td>之前</td><td class="${D.had ? '' : 'none'}">${D.had ? esc(D.nameA) + (D.isFolder ? '/　' + fmtNum(D.n) + ' 個檔' : '　' + fmtBytes(D.sA)) : '還沒有'}</td></tr>
        <tr><td>之後</td><td class="${D.has ? '' : 'none'}">${D.has ? esc(D.nameB) + (D.isFolder ? '/　' + fmtNum(D.n) + ' 個檔' : '　' + fmtBytes(D.sB)) : '不在了'}</td></tr>
        <tr><td>位置</td><td>${esc(where(D.dirB || D.dirA))}</td></tr></table>` : `<table><tr><td>資料夾</td><td>${esc(baseOf(L.x.b.p))}/</td></tr><tr><td>檔數</td><td>${fmtNum(L.x.b.n)}</td></tr></table>`;
    html += `<section class="lead"><div><div class="kicker ${H.lv}">${H.lvText}</div><h2 class="hl"><button ${L.x.b ? `data-batch="${esc(L.x.b.key)}"` : `data-ev="${L.x.e.i}"`}>${esc(L.hl)}</button></h2>
      <p class="stand">${esc(L.st)}本期共 ${fmtNum(M.total)} 個檔有變化：${GROUPS.filter(x => x.g !== 'time' && M.by[x.g]).map(x => `${x.label} ${fmtNum(M.by[x.g])}`).join('、')}。<span class="num">檔案 ${fmtNum(R.before.files)} → ${fmtNum(R.after.files)}（${fmtSigned(R.after.files - R.before.files)}）。</span></p></div>
      <aside class="box c-${L.g}"><h4>前後</h4>${box}<button class="go" ${L.x.b ? `data-batch="${esc(L.x.b.key)}"` : `data-ev="${L.x.e.i}"`}>看全文</button></aside></section>`;
  } else {
    html += `<section class="lead"><div><div class="kicker ${H.lv}">${H.lvText}</div><h2 class="hl">Z:\\ 一切如常</h2><p class="stand">${esc(H.head)}</p></div><div></div></section>`;
  }
  const leadKey = L ? (L.x.b ? 'b:' + L.x.b.key : 'e:' + L.x.e.i) : '';
  const col = (g, title) => {
    const items = eventsOf(R, { g });
    const rows = displayItems(R, items).filter(x => (x.b ? 'b:' + x.b.key : 'e:' + x.e.i) !== leadKey);
    return `<section class="colm c-${g}"><h3><i></i>${title}<small class="num">${fmtNum(filesOf(items))} 個檔</small></h3>${rows.slice(0, 7).map(newsHtml).join('') || '<div class="nil">本期沒有</div>'}${rows.length > 7 ? `<button class="allx" data-type="${g}">全部 ${fmtNum(rows.length)} 則</button>` : ''}</section>`;
  };
  html += `<div class="cols">${col('del', '要聞')}${col('ren', '異動')}${col('size', '大小變動')}${col('add', '新進')}</div>`;
  html += `<section class="index"><h3>部門索引</h3><div class="ix">${O.busy.map(i => `<button class="ixr" data-d="${i}"><b>${esc(DATA.depts[i].name)}</b><span class="num">${fmtNum(M.dept[i].total)}</span></button>`).join('')}</div>
    ${O.quiet.length ? `<div class="quiet">本期沒有變化：${O.quiet.map(i => esc(DATA.depts[i].name)).join('、')}${R.ignored ? `　·　略過 ${fmtNum(R.ignored)} 個暫存與縮圖檔` : ''}</div>` : ''}</section>`;
  $('front').innerHTML = html;
  if (anim) {
    animate($('front').querySelector('.mast'), [{ opacity: 0, transform: 'translateY(-8px)' }, { opacity: 1, transform: 'none' }], { duration: 360, easing: 'cubic-bezier(.2,.8,.2,1)' });
    [...$('front').querySelectorAll('.lead, .colm, .index')].forEach((el, k) => animate(el, [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 120 + k * 80, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
  }
}

// ---- articles ----
function storyHtml(D, spec) {
  const both = D.had && D.has;
  const side = s => {
    const has = s === 'b' ? D.had : D.has, at = s === 'b' ? D.A.at : D.B.at;
    const h = `<h4>${s === 'b' ? '之前' : '之後'}　<span class="num">${fmtMD(at)} ${fmtHM(at)}</span></h4>`;
    if (!has) return `<div>${h}<p class="none">${s === 'b' ? '那時還沒有這個' + (D.isFolder ? '資料夾' : '檔') + '。' : '已經不在了。'}</p></div>`;
    const [ma, mb] = nameMarks(D.nameA, D.nameB);
    const dir = s === 'b' ? D.dirA : D.dirB, other = s === 'b' ? D.dirB : D.dirA;
    const sz = s === 'b' ? D.sA : D.sB, t = s === 'b' ? D.tA : D.tB;
    return `<div>${h}<p>名稱是 <b>${s === 'b' ? ma : mb}${D.isFolder ? '/' : ''}</b>，${D.isFolder ? `裡面 ${fmtNum(D.n)} 個檔、共 ${fmtBytes(sz)}` : `大小 ${fmtBytes(sz)}，修改時間 ${fmtTime(t)}`}。</p>
      <p class="p">${both && s === 'a' && dir === other ? '位置沒變。' : pathHtml(dir || '（最上層）', both ? other : null)}</p></div>`;
  };
  const pull = D.nameA !== D.nameB && both ? `${Q(D.nameA)} → ${Q(D.nameB)}` : D.dirA !== D.dirB && both ? `${Q(where(D.dirA))} → ${Q(where(D.dirB))}` : !D.has ? `${Q(D.nameA)} 不在了` : !D.had ? `新增 ${Q(D.nameB)}` : `${fmtBytes(D.sA)} → ${fmtBytes(D.sB)}`;
  let html = `<div class="kk c-${D.g}">${esc(D.kind)}</div><h2>${esc(D.nameB)}${D.isFolder ? '/' : ''}</h2><div class="by">${esc(D.dept)}　·　${esc(S.R.phrase)}　·　比較 ${esc(S.R.span)}</div>
    <div class="pull c-${D.g}">${esc(pull)}</div><div class="two c-${D.g}">${side('b')}${side('a')}</div>
    <div class="acts">${D.has ? `<button class="btn" data-copy="${esc(D.nowPath)}">${ICON.copy}複製現在的位置</button>` : ''}${D.had ? `<button class="btn" data-copy="${esc(D.oldPath)}">${ICON.copy}複製 ${fmtMD(D.A.at)} 快照裡的位置</button>` : ''}</div>`;
  if (!D.has) html += `<div class="hint">${fmtMD(D.A.at)} 凌晨的快照裡還有，複製位置貼到檔案總管就能找回來。</div>`;
  if (spec.e.k === 'mov' && !spec.e.sure && !spec.child) html += '<div class="hint">名字和位置都不一樣，是靠大小與修改時間配起來的，可能不是同一個檔。</div>';
  if (D.isFolder) html += `<table class="ftab"><tr><th>裡面的檔</th><th>大小</th></tr>${D.files.slice(0, 300).map((f, k) => `<tr class="click" data-file="${k}"><td>${esc(f.r.split('\\').join(' / '))}</td><td class="num">${fmtBytes(f.s)}</td></tr>`).join('')}</table>`;
  return html;
}
function sectionHtml(spec) {
  const R = S.R, items = eventsOf(R, spec.f);
  const title = spec.f.d != null ? `${DATA.depts[spec.f.d].name}版` : `${GL[spec.f.g]}　全部`;
  let html = `<div class="kk">${esc(R.phrase)}</div><h2>${esc(title)}</h2><div class="by">${fmtNum(filesOf(items))} 個檔有變化</div><div class="sect">`;
  for (const x of GROUPS) {
    const gi = items.filter(e => gOf(e) === x.g); if (!gi.length) continue;
    html += `<h5 class="c-${x.g}">${x.label}　${fmtNum(filesOf(gi))}</h5>` + displayItems(R, gi).slice(0, 200).map(newsHtml).join('');
  }
  return html + '</div>';
}
function batchHtml(b) {
  return `<div class="kk c-${b.g}">這個資料夾${esc(BATCH_VERB[b.g])} ${fmtNum(b.n)} 個檔</div><h2>${esc(baseOf(b.p) || '（部門最上層）')}/</h2><div class="by">${esc(deptName(b.d))}　·　${esc(where(b.p))}</div>
    <div class="acts" style="margin:0 0 6px"><button class="btn" data-copy="${esc(DATA.drive + '\\' + b.p)}">${ICON.copy}複製資料夾的位置</button></div>
    <div class="sect">${b.items.slice().sort((p, q) => (baseOf(p.p) < baseOf(q.p) ? -1 : 1)).map(e => newsHtml({ e })).join('')}</div>`;
}
function drawArticle() {
  const sp = S.stack[S.stack.length - 1];
  const body = sp.f ? sectionHtml(sp) : sp.b ? batchHtml(sp.b) : storyHtml(detailModel(sp.e, sp.child, S.R), sp);
  const back = S.stack.length > 1 ? `<button class="back" data-back>${ICON.back}回到${esc(S.stack[S.stack.length - 2].title)}</button>` : '';
  $('art').innerHTML = `<div class="bar">${back}<span class="sp"></span><span>Z:\\ 日報</span><button class="x" data-close aria-label="收起">${ICON.x}</button></div><div class="body">${body}</div>`;
}
function openArticle(spec) {
  const wasOpen = S.stack.length > 0;
  S.stack.push(spec); drawArticle();
  if (!wasOpen) { $('art').classList.add('on'); $('art').setAttribute('aria-hidden', 'false'); $('desk').classList.add('back'); }
  else animate($('art').querySelector('.body'), [{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
}
function closeArticle() { S.stack = []; $('art').classList.remove('on'); $('art').setAttribute('aria-hidden', 'true'); $('desk').classList.remove('back'); }
function setRange(id, anim = true) { S.R = rangeById(id); tellRange(S.R); closeArticle(); renderFront(anim); $('desk').scrollTop = 0; }

document.addEventListener('click', ev => {
  const t = ev.target;
  if (t.closest('[data-copy]')) return;
  if (t.closest('[data-close]')) { closeArticle(); return; }
  if (t.closest('[data-back]')) { S.stack.pop(); drawArticle(); return; }
  const r = t.closest('[data-range]'); if (r) { setRange(r.dataset.range); return; }
  const d = t.closest('[data-d]'); if (d) { openArticle({ f: { d: +d.dataset.d }, title: DATA.depts[+d.dataset.d].name + '版' }); return; }
  const ty = t.closest('[data-type]'); if (ty) { openArticle({ f: { g: ty.dataset.type }, title: GL[ty.dataset.type] }); return; }
  const b = t.closest('[data-batch]'); if (b) { const bb = rangeBatches(S.R).get(b.dataset.batch); openArticle({ b: bb, title: baseOf(bb.p) || '最上層' }); return; }
  const e = t.closest('[data-ev]'); if (e) { const ee = S.R.ev[+e.dataset.ev]; openArticle({ e: ee, title: baseOf(ee.p) }); return; }
  const f = t.closest('[data-file]'); if (f) { const sp = S.stack[S.stack.length - 1], k = +f.dataset.file; openArticle({ e: sp.e, child: sp.e.f[k], title: baseOf(sp.e.f[k].r) }); }
});
wireCopy(document);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.stack.length) { if (S.stack.length > 1) { S.stack.pop(); drawArticle(); } else closeArticle(); } });
zmonBoot(() => setRange(startRange(), true));
</script>
