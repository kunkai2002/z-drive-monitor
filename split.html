<style>
:root{--bg:#f3f1ec;--panel:#fbfaf7;--before:#f1eee7;--after:#ffffff;--ink:#22211d;--ink2:#4a4740;--muted:#7a756a;--faint:#a8a295;
  --line:#e2ddd2;--line2:#cfc8b9;--add:#4f7a3f;--del:#a54a35;--ren:#3f6a86;--size:#9a6a17;--time:#857f73;
  --add-bg:#e9f1e2;--del-bg:#f6e4de;--ren-bg:#e3ecf2;--size-bg:#f5ecd9;--ok:#4a6b42;--warn:#a3711f;--bad:#9c3a2e;
  --mono:"Cascadia Mono",Consolas,"Microsoft JhengHei UI",monospace;--sans:"Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans TC","Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--ren);outline-offset:2px;border-radius:4px}
svg{display:block;flex:0 0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
mark{background:color-mix(in srgb,var(--c,var(--ren)) 22%,transparent);color:inherit;border-radius:2px;padding:0 1px}

/* header: brand + days */
.hd{display:flex;align-items:center;gap:22px;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:700;font-size:15px;white-space:nowrap;letter-spacing:.01em}
.brand span{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.days{display:flex;gap:2px;align-items:flex-end;margin-left:auto}
.dchip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 7px 5px;border-radius:6px;min-width:48px;color:var(--muted)}
.dchip:hover{background:var(--before);color:var(--ink)}
.dchip i{display:block;width:26px;height:18px;position:relative}
.dchip i b{position:absolute;left:0;right:0;bottom:0;background:var(--line2);border-radius:1px}
.dchip i b.d{background:var(--del);opacity:.75}
.dchip span{font-size:11px;white-space:nowrap}
.dchip[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.dchip[aria-pressed="true"] i b{background:#77736a}
.dchip[aria-pressed="true"] i b.d{background:#e08c76;opacity:1}
.span{padding:6px 12px;border:1px solid var(--line2);border-radius:6px;color:var(--ink2);white-space:nowrap;font-size:12px}
.span[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}

/* verdict */
.vd{padding:16px 22px 12px;border-bottom:1px solid var(--line);background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:end}
.sev{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--sv)}
.sev i{width:8px;height:8px;border-radius:50%;background:var(--sv)}
.sev.ok{--sv:var(--ok)} .sev.warn{--sv:var(--warn)} .sev.bad{--sv:var(--bad)}
.head{font-size:20px;font-weight:700;line-height:1.4;margin:3px 0 2px}
.ba{color:var(--muted);font-size:12px}
.ba b{color:var(--ink2);font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fl{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);font-size:12px;color:var(--ink2);white-space:nowrap}
.fl em{font-style:normal;font-family:var(--mono);font-size:11.5px}
.fl[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.gl{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;color:#fff;background:var(--c);flex:0 0 16px}
.c-add{--c:var(--add);--cb:var(--add-bg)} .c-del{--c:var(--del);--cb:var(--del-bg)} .c-ren{--c:var(--ren);--cb:var(--ren-bg)} .c-size{--c:var(--size);--cb:var(--size-bg)} .c-time{--c:var(--time);--cb:#eeebe4}

/* body: rail + the two parallel windows */
.body{flex:1;min-height:0;display:grid;grid-template-columns:208px minmax(0,1fr)}
.rail{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 10px}
.rail h3{margin:2px 6px 8px;font-size:11px;color:var(--muted);letter-spacing:.12em;font-weight:600}
.rd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;width:100%;padding:7px 8px;border-radius:6px}
.rd:hover{background:var(--before)}
.rd.on{background:var(--ink);color:var(--panel)}
.rd b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd .bar{grid-column:1 / -1;display:flex;height:3px;border-radius:2px;overflow:hidden;background:var(--line)}
.rd .bar span{background:var(--c)}
.quiet{font-size:11.5px;color:var(--faint);padding:10px 8px;line-height:1.7}
.split{overflow:auto;position:relative}
.cols{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);background:var(--panel);border-bottom:1px solid var(--line2);font-size:12px;font-weight:700;color:var(--ink2)}
.cols div{padding:9px 16px}
.cols .b{background:var(--before)} .cols .a{background:var(--after)}
.cols .mid{padding:0;background:var(--panel)}
.dept{position:sticky;top:38px;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);background:var(--panel);border-bottom:1px solid var(--line)}
.dept div{padding:9px 16px;font-weight:700}
.dept .b{background:color-mix(in srgb,var(--before) 70%,var(--panel));font-size:18px;font-weight:800}
.dept small{font-size:12px;font-weight:400;color:var(--faint);margin-left:6px}
.dept.flash{animation:flash 900ms ease}
@keyframes flash{0%{box-shadow:inset 3px 0 0 var(--ren)}100%{box-shadow:inset 3px 0 0 transparent}}
.ctx{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);font-size:13px;font-weight:600;color:var(--ink2)}
.ctx div{padding:10px 16px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx .b{background:var(--before)} .ctx .a{background:var(--after)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);width:100%;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.row > div{padding:7px 16px;min-width:0}
.row .b{background:var(--before)} .row .a{background:var(--after)}
.row.c-del .b{background:color-mix(in srgb,var(--del-bg) 70%,var(--before))}
.row.c-add .a{background:color-mix(in srgb,var(--add-bg) 75%,var(--after))}
.row:hover .b,.row:hover .a{filter:brightness(.985)}
.row.open{box-shadow:inset 3px 0 0 var(--c)}
.row .g{display:grid;place-items:center;padding:0;background:var(--panel)}
.cell{display:flex;align-items:baseline;gap:10px;min-width:0}
.cell .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .nm.strong{font-weight:400}
.cell .mt{flex:0 0 auto;color:var(--muted)}
.cell .no{color:var(--faint)}
.cell .tag{font-size:11px;color:var(--c);font-weight:700;flex:0 0 auto}
.sub{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.more{display:block;margin:8px auto 14px;padding:5px 14px;border:1px solid var(--line2);border-radius:999px;font-size:12px;color:var(--ink2)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

/* inline detail under a row */
.dt{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);overflow:hidden;border-bottom:1px solid var(--line2)}
.dt > div{padding:10px 16px 14px}
.dt .b{background:var(--before)} .dt .a{background:var(--after)} .dt .g{background:var(--panel)}
.kv{display:grid;grid-template-columns:58px minmax(0,1fr);gap:6px 10px;font-size:12px}
.kv dt{color:var(--faint)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv dd.none{color:var(--faint)}
.kv .p{color:var(--muted);line-height:1.6} .kv .p mark{color:var(--ink)}
.sep{font-style:normal;color:var(--faint);margin:0 4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line2);border-radius:6px;font-size:12px;color:var(--ink2);background:var(--panel)}
.btn:hover{background:var(--before)}
.btn.done{color:var(--ok);border-color:var(--ok)}
.files{margin-top:10px;max-height:240px;overflow:auto;border-top:1px dashed var(--line2)}
.files div{display:flex;gap:10px;padding:4px 0;font-size:12px;border-bottom:1px dashed var(--line)}
.files div span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px}
.foot{padding:10px 16px 40px;font-size:11.5px;color:var(--faint)}
@media (max-width:980px){.body{grid-template-columns:1fr}.rail{display:none}.vd{grid-template-columns:1fr}.filters{justify-content:flex-start}.days{overflow:auto}}
@media (max-width:640px){.hd{flex-wrap:wrap;gap:6px 16px;padding:10px 16px}.brand span{display:none}.days{margin-left:0;width:100%;overflow-y:hidden;scrollbar-width:none}.dchip,.span{flex:none}.vd{padding:14px 16px 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  const f = t.closest('.fl'); if (f) { S.g = f.dataset.g || null; S.open.clear(); renderVerdict(); renderSplit(true); return; }
  const rd = t.closest('.rd');
  if (rd) {
    const sec = $('split').querySelector(`.dsec[data-dept="${rd.dataset.d}"]`);
    S.pinned = rd.dataset.d;
    if (sec) {
      $('split').scrollTo({ top: sec.offsetTop - 38, behavior: reduceMotion() ? 'auto' : 'smooth' });
      const head = sec.querySelector('.dept'); head.classList.remove('flash'); void head.offsetWidth; head.classList.add('flash');
    }
    document.querySelectorAll('.rd').forEach(x => x.classList.toggle('on', x === rd));
    return;
  }
  const m = t.closest('[data-more]'); if (m) { S.shown[m.dataset.more] = (S.shown[m.dataset.more] || 60) + 200; renderSplit(false); return; }
  if (t.closest('[data-copy]')) return;
  const row = t.closest('.row'); if (row) toggle(row);
});
wireCopy(document);
document.addEventListener('keydown', ev => { const row = ev.target.closest && ev.target.closest('.row'); if (row && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); toggle(row); } });
// the rail follows the department in view; one picked in the rail stays lit until the reader scrolls by hand
// (the last departments can never reach the top, so following the scroll would light the one above them)
['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(t => $('split').addEventListener(t, () => { S.pinned = null; }, { passive: true }));
$('split').addEventListener('scroll', () => {
  if (S.pinned != null) return;
  const top = $('split').scrollTop + 60; let cur = null;
  for (const s of $('split').querySelectorAll('.dsec')) if (s.offsetTop <= top) cur = s.dataset.dept;
  document.querySelectorAll('.rd').forEach(x => x.classList.toggle('on', x.dataset.d === cur));
}, { passive: true });

zmonBoot(() => { $('share').textContent = DATA.shareName; setRange(startRange(), true); });
</script>
