<style>
:root{--bg:#f4f1ea;--page:#fffefb;--ink:#1f1d19;--ink2:#47433b;--muted:#7a7468;--faint:#aaa395;--line:#e7e1d5;--line2:#d3cab8;
  --add:#567c44;--del:#a84d37;--ren:#416c8a;--size:#9a6b1a;--time:#857e71;--ok:#4a6b42;--warn:#a3711f;--bad:#9c3a2e;
  --serif:"Noto Serif TC","Source Han Serif TC","PMingLiU",Georgia,serif;--sans:"Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans TC",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.75 var(--sans);-webkit-font-smoothing:antialiased;overflow:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--ren);outline-offset:3px;border-radius:4px}
svg{display:block;flex:0 0 auto}
.num{font-variant-numeric:tabular-nums}
.c-add{--c:var(--add)} .c-del{--c:var(--del)} .c-ren{--c:var(--ren)} .c-size{--c:var(--size)} .c-time{--c:var(--time)}
.wrap{position:relative;max-width:1240px;margin:0 auto;padding:44px 36px 120px;display:grid;grid-template-columns:minmax(0,760px) minmax(0,1fr);gap:0 48px}
.memo{background:var(--page);border:1px solid var(--line);border-radius:4px;padding:46px 56px 56px;box-shadow:0 1px 2px rgba(60,50,30,.05),0 24px 60px -40px rgba(60,50,30,.35);position:relative}
.mh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line2);padding-bottom:12px;margin-bottom:26px}
.mh b{font-family:var(--serif);font-size:15px;letter-spacing:.14em;white-space:nowrap}
.mh .dts{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.dt{font-size:12px;color:var(--muted);padding:1px 7px;border-radius:3px}
.dt:hover{color:var(--ink);background:var(--bg)}
.dt[aria-pressed="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.sev{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--sv);letter-spacing:.06em}
.sev i{width:9px;height:9px;border-radius:50%;background:var(--sv)}
.sev.ok{--sv:var(--ok)} .sev.warn{--sv:var(--warn)} .sev.bad{--sv:var(--bad)}
h1{font-family:var(--serif);font-size:31px;line-height:1.45;margin:10px 0 6px;font-weight:700}
.ba{font-size:13px;color:var(--muted)}
.ba b{color:var(--ink2);font-weight:600}
.claims{list-style:none;padding:0;margin:30px 0 0;counter-reset:c}
.claim{position:relative;padding-left:40px;margin:0 0 6px;transition:opacity 260ms ease}
.claim::before{counter-increment:c;content:counter(c);position:absolute;left:0;top:9px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);color:var(--muted);font-size:12px;display:grid;place-items:center}
.claims.focus .claim:not(.open){opacity:.5}
.say{display:inline;font-family:var(--serif);font-size:21px;line-height:1.85;color:var(--ink);background-image:linear-gradient(var(--c),var(--c));background-repeat:no-repeat;background-position:0 100%;background-size:0 2px;transition:background-size 380ms cubic-bezier(.2,.8,.2,1)}
.say:hover{background-size:100% 1px}
.claim.open .say{background-size:100% 2px}
.say small{font-family:var(--sans);font-size:12.5px;color:var(--faint);margin-left:6px;white-space:nowrap}
.ev{overflow:hidden}
.ev-in{padding:8px 0 14px}
.evh{font-size:11.5px;letter-spacing:.16em;color:var(--muted);font-weight:700;margin:4px 0 4px}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 10px;align-items:baseline;width:100%;padding:6px 8px;border-radius:4px;font-size:13px}
.it:hover{background:var(--bg)}
.it.on{background:color-mix(in srgb,var(--c) 9%,var(--page))}
.it .k{font-size:11.5px;font-weight:700;color:var(--c);white-space:nowrap}
.it .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t s{text-decoration:none;color:var(--muted)}
.it .m{font-size:12px;color:var(--muted);white-space:nowrap}
.it .w{grid-column:2 / 4;font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{margin:6px 0 0 8px;font-size:12px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.rest{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.9}
.rest button{text-decoration:underline;text-underline-offset:3px;color:var(--ink2)}
/* margin notes */
.margin{position:relative}
.note{position:absolute;left:0;right:0;background:var(--page);border:1px solid var(--line2);border-left:3px solid var(--c);border-radius:4px;padding:14px 16px 16px;font-size:13px;box-shadow:0 14px 30px -22px rgba(60,50,30,.45)}
.note .k{font-size:11.5px;font-weight:700;color:var(--c);letter-spacing:.08em}
.note h3{font-family:var(--serif);font-size:17px;margin:2px 0 8px;line-height:1.45;overflow-wrap:anywhere}
.note p{margin:0 0 8px;color:var(--ink2);line-height:1.75}
.note p b{font-weight:600;color:var(--ink)}
.note .q{color:var(--muted);font-size:12px}
.note .x{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.note .x:hover{background:var(--bg)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line2);border-radius:4px;font-size:12px;background:var(--page)}
.btn:hover{background:var(--bg)}
.btn.done{color:var(--ok);border-color:var(--ok)}
.files{margin-top:8px;max-height:200px;overflow:auto;border-top:1px dashed var(--line2)}
.files button{display:flex;gap:8px;width:100%;padding:4px 0;font-size:12px;border-bottom:1px dashed var(--line)}
.files button span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files button span:last-child{color:var(--muted)}
svg.wire{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
svg.wire path{fill:none;stroke:var(--c);stroke-width:1.2;stroke-dasharray:3 3}
@media (max-width:1240px){.wrap{grid-template-columns:minmax(0,1fr);max-width:820px}.margin{display:none}.note.inline{position:relative;margin:8px 0 6px}}
@media (max-width:640px){.it{grid-template-columns:auto minmax(0,1fr)}.it .m,.it .w{grid-column:2}}
</style>

  return out.sort((a, b) => b.p - a.p);
}

function renderMemo(anim) {
  const R = S.R, H = headline(R), a = R.before, b = R.after, O = deptOrder(R);
  const C = claims(R); S.claims = C;
  const days = [...DATA.days.map(d => d.range), ...DATA.presets.filter(p => !p.startsWith('day:'))];
  let html = `<header class="mh"><b>Z:\\ 每日簡報</b><nav class="dts">${days.map(id => `<button class="dt num" data-range="${esc(id)}" aria-pressed="${S.R.id === id}">${esc(rangeById(id).short)}</button>`).join('')}</nav></header>
    <span class="sev ${H.lv}"><i></i>${H.lvText}</span><h1>${esc(H.head)}</h1>
    <div class="ba num">檔案 <b>${fmtNum(a.files)}</b> → <b>${fmtNum(b.files)}</b>（${fmtSigned(b.files - a.files)}）　容量 <b>${fmtBytes(a.bytes)}</b> → <b>${fmtBytes(b.bytes)}</b>（${fmtDelta(b.bytes - a.bytes)}）　·　${esc(R.span)}</div>`;
  html += `<ol class="claims" id="claims">${C.map((c, k) => `<li class="claim c-${c.g}" data-c="${k}"><button class="say" data-say="${k}">${esc(c.say)}。${c.n ? `<small class="num">${esc(c.n)}</small>` : ''}</button><div class="ev" hidden></div></li>`).join('') || '<li class="claim"><span class="say">這段時間沒有變化。</span></li>'}</ol>`;
  const restBits = [];
  if (O.quiet.length) restBits.push(`${O.quiet.map(i => DATA.depts[i].name).join('、')}沒有變化。`);
  if (R.ignored) restBits.push(`略過 ${fmtNum(R.ignored)} 個暫存與縮圖檔。`);
  if (DATA.days.length > 1) restBits.push(`前幾天：${DATA.days.map(d => `<button data-range="${esc(d.range)}">${esc(d.md)} ${fmtNum(d.c.total)}</button>`).join('　')}`);
  html += `<div class="rest">${restBits.join('<br>')}</div>`;
  $('memo').innerHTML = html;
  $('margin').innerHTML = ''; $('wire').innerHTML = '';
  if (anim) [...$('memo').querySelectorAll('h1, .ba, .claim')].forEach((el, k) => animate(el, [{ transform: 'translateY(10px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, delay: 80 + k * 90, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
}
function evHtml(c, k) {
  const R = S.R, rows = displayItems(R, c.ev), lim = S.shown[k] || 8;
  return `<div class="ev-in"><div class="evh">依據　${fmtNum(filesOf(c.ev))} 個檔</div>${rows.slice(0, lim).map(x => {
    const T = x.b ? batchText(x.b) : rowText(x.e);
    const nm = T.name.old ? `<s>${esc(T.name.old)}</s> → ${esc(T.name.now)}` : esc(T.name.now) + (T.folder && !x.b ? '/' : '');
    return `<button class="it c-${T.g}" ${x.b ? `data-batch="${esc(x.b.key)}"` : `data-ev="${x.e.i}"`}><span class="k">${esc(x.b ? BATCH_VERB[x.b.g] + ' ' + fmtNum(x.b.n) : T.label)}</span><span class="t">${nm}</span><span class="m num">${esc(T.meta)}</span><span class="w">${esc(deptName(x.b ? x.b.d : x.e.d))} · ${esc(T.place)}</span></button>`;
  }).join('')}${rows.length > lim ? `<button class="more" data-more="${k}">再列 ${fmtNum(Math.min(20, rows.length - lim))} 個（還有 ${fmtNum(rows.length - lim)} 個）</button>` : ''}</div>`;
}
function toggleClaim(k) {
  const li = $('memo').querySelector(`.claim[data-c="${k}"]`), ev = li.querySelector('.ev');
  const was = S.open;
  closeNote();
  if (was != null && was !== k) {
    const pl = $('memo').querySelector(`.claim[data-c="${was}"]`), pev = pl.querySelector('.ev');
    pl.classList.remove('open'); pev.hidden = true; pev.innerHTML = '';
  }
  if (was === k) { li.classList.remove('open'); $('claims').classList.remove('focus'); S.open = null; const h = ev.offsetHeight; animate(ev, [{ height: h + 'px' }, { height: '0px' }], { duration: 200 }).then(() => { ev.hidden = true; ev.innerHTML = ''; }); return; }
  S.open = k; li.classList.add('open'); $('claims').classList.add('focus');
  ev.innerHTML = evHtml(S.claims[k], k); ev.hidden = false;
  const h = ev.offsetHeight;
  animate(ev, [{ height: '0px', opacity: 0 }, { height: h + 'px', opacity: 1 }], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

// the margin note: plain words for before and after, pinned next to the row it explains
function prose(D) {
  const at = (s) => `${fmtMD(s)} ${fmtHM(s)}`;
  const loc = d => esc(where(d));
  const k = D.e.k, ps = [];
  if (!D.had) ps.push(`${at(D.A.at)} 還沒有。${at(D.B.at)} 出現在 <b>${loc(D.dirB)}</b>，${D.isFolder ? `裡面 ${fmtNum(D.n)} 個檔、共 ${fmtBytes(D.sB)}` : `大小 ${fmtBytes(D.sB)}，修改時間 ${fmtTime(D.tB)}`}。`);
  else if (!D.has) ps.push(`${at(D.A.at)} 還在 <b>${loc(D.dirA)}</b>，${D.isFolder ? `裡面 ${fmtNum(D.n)} 個檔、共 ${fmtBytes(D.sA)}` : `大小 ${fmtBytes(D.sA)}`}。${at(D.B.at)} 已經不在了。`);
  else {
    if (D.nameA !== D.nameB) ps.push(`原本叫 <b>${esc(D.nameA)}</b>，現在叫 <b>${esc(D.nameB)}</b>。`);
    if (D.dirA !== D.dirB) ps.push(`從 <b>${loc(D.dirA)}</b> 搬到 <b>${loc(D.dirB)}</b>。`); else if (D.nameA !== D.nameB) ps.push('位置沒變。');
    if (D.sA !== D.sB) ps.push(`大小從 ${fmtBytes(D.sA)} 變成 ${fmtBytes(D.sB)}（${fmtDelta(D.sB - D.sA)}）。`);
    if (!D.isFolder && D.tA !== D.tB) ps.push(`修改時間從 ${fmtTime(D.tA)} 變成 ${fmtTime(D.tB)}。`);
  }
  return ps.filter(Boolean).map(p => `<p>${p}</p>`).join('');
}
function noteHtml(spec) {
  const R = S.R;
  if (spec.b) {
    const b = spec.b;
    return `<div class="k">這個資料夾${esc(BATCH_VERB[b.g])} ${fmtNum(b.n)} 個檔</div><h3>${esc(baseOf(b.p) || '（部門最上層）')}/</h3><p class="q">${esc(deptName(b.d))} · ${esc(where(b.p))}</p>
      <div class="files">${b.items.slice().sort((p, q) => (baseOf(p.p) < baseOf(q.p) ? -1 : 1)).map(e => `<button data-ev="${e.i}"><span>${esc(baseOf(e.p))}</span><span class="num">${esc(rowText(e).meta)}</span></button>`).join('')}</div>
      <div class="acts"><button class="btn" data-copy="${esc(DATA.drive + '\\' + b.p)}">${ICON.copy}複製資料夾的位置</button></div>`;
  }
  const D = detailModel(spec.e, spec.child, R);
  return `<div class="k">${esc(D.kind)}</div><h3>${esc(D.nameB)}${D.isFolder ? '/' : ''}</h3>${prose(D)}
    ${!D.has ? `<p class="q">${fmtMD(D.A.at)} 凌晨的快照裡還有，複製位置貼到檔案總管就能找回來。</p>` : ''}
    ${spec.e.k === 'mov' && !spec.e.sure && !spec.child ? '<p class="q">名字和位置都不一樣，是靠大小與修改時間配起來的，可能不是同一個檔。</p>' : ''}
    ${D.isFolder ? `<div class="files">${D.files.slice(0, 200).map((f, k) => `<button data-file="${k}"><span>${esc(f.r.split('\\').join(' / '))}</span><span class="num">${fmtBytes(f.s)}</span></button>`).join('')}</div>` : ''}
    <div class="acts">${D.has ? `<button class="btn" data-copy="${esc(D.nowPath)}">${ICON.copy}複製現在的位置</button>` : ''}${D.had ? `<button class="btn" data-copy="${esc(D.oldPath)}">${ICON.copy}複製 ${fmtMD(D.A.at)} 快照裡的位置</button>` : ''}</div>`;
}
function openNote(itemEl, spec) {
  closeNote(true);
  document.querySelectorAll('.it.on').forEach(x => x.classList.remove('on')); itemEl.classList.add('on');
  S.item = spec;
  const g = spec.b ? spec.b.g : gOf(spec.e);
  const narrow = getComputedStyle($('margin')).display === 'none';
  const note = document.createElement('div');
  note.className = `note c-${g}${narrow ? ' inline' : ''}`;
  note.innerHTML = `<button class="x" data-closenote aria-label="收起">${ICON.x}</button>` + noteHtml(spec);
  if (narrow) { itemEl.insertAdjacentElement('afterend', note); animate(note, [{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 260 }); return; }
  $('margin').appendChild(note);
  const W = $('wrap').getBoundingClientRect(), I = itemEl.getBoundingClientRect(), M = $('margin').getBoundingClientRect();
  const top = Math.max(0, I.top - M.top - 12);
  note.style.top = top + 'px';
  animate(note, [{ opacity: 0, transform: 'translateX(28px)' }, { opacity: 1, transform: 'none' }], { duration: 340, easing: 'cubic-bezier(.2,.8,.2,1)' });
  // a dashed wire from the row to the note
  const x1 = I.right - W.left - 4, y1 = I.top - W.top + I.height / 2, x2 = M.left - W.left, y2 = top + (M.top - W.top) + 26;
  $('wire').setAttribute('class', `wire c-${g}`);
  $('wire').innerHTML = `<path d="M${x1} ${y1} C ${x1 + 40} ${y1}, ${x2 - 40} ${y2}, ${x2} ${y2}"/>`;
  const p = $('wire').querySelector('path'), L = p.getTotalLength();
  animate(p, [{ strokeDashoffset: L, opacity: 0 }, { strokeDashoffset: 0, opacity: 1 }], { duration: 420, easing: 'ease-out' });
}
function closeNote(silent) {
  document.querySelectorAll('.note').forEach(n => { if (silent) n.remove(); else animate(n, [{ opacity: 1 }, { opacity: 0 }], { duration: 150 }).then(() => n.remove()); });
  $('wire').innerHTML = ''; S.item = null;
  if (!silent) document.querySelectorAll('.it.on').forEach(x => x.classList.remove('on'));
}
function setRange(id, anim = true) { S.R = rangeById(id); S.open = null; S.shown = {}; tellRange(S.R); renderMemo(anim); }

document.addEventListener('click', ev => {
  const t = ev.target;
  if (t.closest('[data-copy]')) return;
  if (t.closest('[data-closenote]')) { closeNote(); return; }
  const r = t.closest('[data-range]'); if (r) { setRange(r.dataset.range); return; }
  const s = t.closest('[data-say]'); if (s) { toggleClaim(+s.dataset.say); return; }
  const m = t.closest('[data-more]'); if (m) { const k = +m.dataset.more; S.shown[k] = (S.shown[k] || 8) + 20; const ev2 = $('memo').querySelector(`.claim[data-c="${k}"] .ev`); ev2.innerHTML = evHtml(S.claims[k], k); return; }
  const inNote = t.closest('.note');
  const b = t.closest('[data-batch]'); if (b) { openNote(b, { b: rangeBatches(S.R).get(b.dataset.batch) }); return; }
  const e = t.closest('[data-ev]'); if (e) { const ee = S.R.ev[+e.dataset.ev]; const anchor = inNote ? (document.querySelector('.it.on') || e) : e; openNote(anchor, { e: ee }); return; }
  const f = t.closest('[data-file]'); if (f && S.item && S.item.e) { const pe = S.item.e, k = +f.dataset.file; openNote(document.querySelector('.it.on') || f, { e: pe, child: pe.f[k] }); }
});
wireCopy(document);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if (S.item) closeNote(); else if (S.open != null) toggleClaim(S.open); } });
addEventListener('resize', () => closeNote(true));
zmonBoot(() => setRange(startRange(), true));
</script>
